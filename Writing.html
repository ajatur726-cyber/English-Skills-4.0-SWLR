. Participants initially interpreted each other's concerns unfairly. Questions about cost were treated as proof of indifference, while accessibility needs were dismissed as minor preferences. A facilitator asked the group to separate essential access, financial constraints, and alternative designs. People affected by the proposal were invited to describe needs without being asked to represent an entire group. The meeting did not end in unanimous agreement. It produced a clearer problem definition and a list of information required before selection. This was a useful outcome because the early discussion had mixed factual uncertainty with personal accusations. Future consultations should explain how contributions affect the decision and identify who holds final authority. Respect does not require pretending that resources are unlimited or all options equally suitable. It requires a process in which reasons are examined, needs are not ridiculed, and unresolved questions remain visible rather than being hidden by a rushed vote.", "words": 161, "independent": "Write a report about an invented debate on school quiet zones. Include initial misunderstandings, a facilitation method, remaining disagreement, and recommendations.", "audience": "a school or project review group", "goal": "Write a report about respectful communication, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the purpose and scope of a review. Evidence: This report reviews a fictional discussion about redesigning a public study space."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps summarise implications, limitations, or recommendations. Evidence: It requires a process in which reasons are examined, needs are not ridiculed, and unresolved questions remain visible rather than being hidden by a rushed v eaders", "genre": "formal letter", "model": "Dear publication committee, I am writing about the article on scholarship deadlines shared through our student channels. The original post gives a date that conflicts with the organiser's current announcement. Please verify the detail and, if necessary, publish a visible correction alongside the updated article. Quietly replacing the number may not help readers who saved or forwarded the earlier version. It would also be useful to contact the channels that redistributed the post and include the date of the latest check. I recognise that information can change after careful preparation, so this request does not assume deliberate misconduct. It concerns how the publication responds once a problem is identified. For future high-impact details, a second review before release could reduce avoidable mistakes. Please explain how readers can report possible errors without posting personal application information. Thank you for considering a correction process that prioritises readers' decisions rather than only the appearance of a flawless publication. Yours faithfully, A Student Contributor.", "words": 160, "independent": "Write a formal letter about an invented misleading entry-fee notice in a school competition guide. Request verification, visible correction, redistribution updates, and a review process.", "audience": "the relevant school or club committee", "goal": "Write a formal letter about following through on a commitment, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the reason for writing to a decision-maker. Evidence: Dear publication committee, I am writing about the article on scholarship deadlines shared through our student channels."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps make a clear request and close respectfully. Evidence: Yours faithfully, A Student Contributor."}], "bank": ["correction", "consequence", "prevention", "accountability"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["I recognise that information can change after careful preparation, so this request does not assume deliberate misconduct. It concerns how the publication responds once a problem is identified.", "Thank you for considering a correction process that prioritises readers' decisions rather than only the appearance of a flawless publication. Yours faithfully, A Student Contributor.", "Dear publication committee, I am writing about the article on scholarship deadlines shared through our student channels. The original post gives a date that conflicts with the organiser's current announcement."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Thank you for considering a correction process that prioritises readers' decisions _____ only the appearance of a flawless publication.", "options": ["Therefore", "However", "rather than"], "answer": "rather than", "explanation": "The model uses “rather than”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use and never require disclosure of personal distress.", "independentKK": "Тек ақылы сертификаттарды есептейтін ойдан шығарылған марапатты талдайтын мақала жазыңыз. Мүмкіндік айырмасын, балама дәлел мен шолуды түсіндіріңіз.", "audienceKK": "мектеп журналының оқырмандары"}, {"id": "g10-t13", "grade": 10, "topic": 12, "category": "Gratitude", "strand": "values", "title": "An Archive That Can Say Thank You Carefully", "genre": "report", "model": "Our fictional anniversary project examined whose work appeared in a school archive. Early displays highlighted student leaders and memorable performances. Interviews and old programmes revealed years of routine support by staff and volunteers. We added short accounts of those contributions and asked people how they preferred to be credited. Some recollections differed, so statements were attributed rather than treated as confirmed facts. The archive remained selective, and we left a route for later additions. This work combined appreciation with careful record keeping. It did not require idealising the school or claiming that every experience had been positive. Instead, it recognised specific labour that sustained opportunities. Future archive teams should document the basis of each account, check permissions, and consider whose absence may reflect earlier selection choices. Gratitude becomes more credible when it is precise about evidence and contribution. A thank-you can honour people without turning complexity into an unrealistically simple success story.", "words": 152, "independent": "Write a report about an invented project documenting volunteers behind a youth festival. Include sources, attribution, permission, omissions, and a process for additions.", "audience": "a school or project review group", "goal": "Write a report about specific appreciation, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening int and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: A celebratory message should not become a list of institutional problems. Specific appreciation can remain positive without claiming that every experience was perfect. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "Everything was perfect for everyone, so nobody should mention a difficulty.", "answer": "Possible revision: Specific appreciation can recognise support without claiming that every experience was identical. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["State purpose, scope, and fictional method.", "Present findings with clear examples. Distinguish evidence from interpretation and limits.", "Give recommendations linked to findings."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Жастар фестивалінің артындағы еріктілерді құжаттайтын ойдан шығарылған жоба туралы есеп жазыңыз. Дерек, атрибуция, рұқсат, қалып қойғандар және толықтыру жолы болсын.", "audienceKK": "мектептік не жобалық шолу тобы"}, {"id": "g10-t14", "grade": 10, "topic": 13, "category": "Digital kindness", "strand": "digital", "title": "Outrage Can Become Distribution", "genre": "article", "model": "Sharing a harmful post to condemn it can unintentionally give it a larger audience. In an invented school incident, sympathetic captions accompany a humiliating image, yet the targeted pupil still experiences wider exposure. The viewers' intentions do not determine every consequence of their action. A more useful response might discuss the harmful pattern without reproducing the image or identifying the person. Private support and appropriate reporting can also be more effective than a public contest in disapproval. This is not an argument for ignoring cruelty. It asks participants to consider what would reduce harm rather than only display their own position. Digital literacy includes recognising how circulation changes the effect of content. Before sharing, a reader should ask who gains attention, who loses control, and whether the same concern can be expressed without redistributing the material. The strongest response may be less visible while offering more practical help to the person being targeted.", "words": 153, "independent": "Write an article about responding to an invented humiliating voice clip. Discuss intentions versus effects, safer public discussion, private support, and non-amplification.", "audience": "readers of a school magazine", "goal": "Write an article about considerate online communication, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence never require disclosure of personal distress.", "independentKK": "Ойдан шығарылған қорлайтын дауыс үзіндісіне жауап туралы мақала жазыңыз. Ниет пен әсер, қауіпсіз талқылау, жеке қолдау және таратпау болсын.", "audienceKK": "мектеп журналының оқырмандары"}, {"id": "g10-t15", "grade": 10, "topic": 14, "category": "Privacy and consent", "strand": "digital", "title": "When Permission Needs to Be Asked Again", "genre": "formal letter", "model": "Dear media team, our fictional project group is reviewing a proposed promotional video. A pupil previously agreed to appear in a photograph for a closed classroom presentation. The new plan would place that image on a public page with a much wider audience. Please do not assume that the earlier agreement covers this different purpose. We recommend explaining the proposed use clearly and offering an image of the project without identifiable people. Declining should not affect anyone's place in the activity or the credit they receive. A signature alone is not evidence of meaningful choice if a pupil cannot understand the use or feels unable to refuse. Please also explain the available process for raising later concerns, without promising that every public copy could be recovered. Thank you for considering consent as an ongoing design question rather than a permanent permission attached to an image. A careful process protects participants while still allowing useful communication about the project. Yours faithfully, A Student Project Representative.", "words": 164, "independent": "Write a formal letter about an invented plan to reuse a closed interview recording in a public school podcast. Request renewed explanation, alternatives, and refusal without disadvantage.", "audience": "the relevant school or club committee", "goal": "Write a formal letter about permission and personal information, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful ar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Some useful services need limited personal information. Each request should still have a clear purpose and be compared with a less intrusive design. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "They said yes once, so we can use everything forever.", "answer": "Possible revision: Permission should be checked against the actual purpose and audience rather than assumed to cover every future use. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["Decide the purpose, audience, and essential details for the new task.", "Choose your own structure and test whether every part serves that purpose."], "support": "independent", "starters": [], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Жабық сұхбатты ашық мектеп подкастына қайта пайдалану туралы ресми хат жазыңыз. Жаңа түсіндіру, балама және салдарсыз бас тартуды сұраңыз.", "audienceKK": "тиісті мектеп не үйірме комитеті"}, {"id": "g10-t16", "grade": 10, "topic": 15, "category": "Cyberbullying and support", "strand": "digital", "title": "A Support Plan Must Be Reviewed", "genre": "proposal", "model": "Our fictional school workshop recommends a support plan for pupils affected by repeated online harassment. The plan should identify a trusted contact, secure handling of relevant evidence, and appropriate reporting or blocking options. It should also preserve access to learning updates through a safer route when leaving a harmful chat becomes necessary. The pupil should not be asked to monitor messages continuously or retell distressing details to a public group. A scheduled check-in will review whether the measures actually help and whether another adult should be involved. One report cannot be treated as a guarantee that content will disappear immediately. Evaluation should therefore consider the pupil's experience and participation, not only completed forms. Staff need a clear way to adapt the response when circumstances change. This proposal does not replace school safeguarding procedures. It offers principles for a practical, respectful process in which responsibility is shared and the targeted learner retains choices about manageable support.", "words": 155, "independent": "Write a proposal for an invented online arts club's anti-harassment support process. Include trusted contacts, continued participation, secure evidence, follow-up, and limits of reporting.", "audience": "a school or club planning committee", "goal": "Write a proposal about support after fictional online harm, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a need and a suggested course of action. Evidence: Our fictional school workshop recommends a support plan for pupils affected by repeated online harassment."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps state review conditions or a reason for the recommendation. Evidence: It offers principles for a practical, respectful process in which responsibility is shared and the targeted learner retains choices about manageable support."}], "bank": ["confidentiality", "participation", "follow-up", "evaluation"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["One report cannot be treated as a guarantee that content will disappear immediately. Evaluation should therefore consider the pupil's experience and participation, not only completed forms.", "This proposal does not replace school safeguarding procedures. It offers principles for a practical, respectful process in which responsibility is shared and the targeted learner retains choices about manageable support.", "Our fictional school workshop recommends a support plan for pupils affected by repeated online harassment. The plan should identify a trusted contact, secure handling of relevant evidence, and appropriate reporting or blocking options."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Evaluation should _____ consider the pupil's experience and participation, not only completed forms.", "options": ["However", "Similarly", "therefore"], "answer": "therefore he new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Ойдан шығарылған онлайн өнер клубының қудалауға қарсы қолдау үдерісін ұсыныңыз. Сенімді байланыс, қатысу, қауіпсіз дәлел, қайта байланыс және шағым шектеуі болсын.", "audienceKK": "мектеп не үйірме жоспарлау комитеті"}, {"id": "g11-t1", "grade": 11, "topic": 0, "category": "About myself", "strand": "core", "title": "A Personal Statement That Can Be Defended", "genre": "article", "model": "A convincing personal statement should make claims that its examples can support. In an invented application, a pupil initially describes a research project as a sequence of decisions she planned perfectly. Her working notes show something more interesting: an early question was too broad, a teammate challenged the method, and an interview changed the conclusion. Revising the account allows her to demonstrate judgement rather than merely announce ability. She credits collaboration and distinguishes her actions from outcomes influenced by several people. This does not require confessing every minor difficulty or revealing other participants' private circumstances. Selection is necessary in a short text, but selection becomes distortion when it removes information essential to understanding the claim. I would advise applicants to examine the verbs they use. Led, created, assisted, and revised imply different kinds of agency and should match the evidence. A statement can remain ambitious while acknowledging a limit and identifying a genuine next question. Intellectual honesty makes the writing more specific, not less confident. The reader gains a clearer basis for deciding what the applicant has learned and what further opportunities could help them develop.", "words": 186, "independent": "Write an article advising invented applicants to a youth research programme. Use a fictional example of revision and explain precise agency, credit, privacy, and a next learning question.", "audience": "readers of a school magazine", "goal": "Write an article about an invented learner’s interests and goals, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence: A convincing personal statement should make claims that its examples can support."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps bring the discussion to a supported conclusion. Evidence: The reader gains a clearer basis for deciding what the applicant has learned and what further opportunities could help them develop."}], "bank": ["reflection", "evidence", "agency", "revision"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Intellectual honesty makes the writing more specific, not less confident. The reader gains a clearer basis for deciding what the applicant has learned and what further opportunities could help them develop.", "A convincing personal statement should make claims that its examples can support. In an invented application, a pupil initially describes a research project as a sequence of decisions she planned perfectly.", "Selection is necessary in a short text, but selection becomes distortion when it removes information essential to understanding the claim. I would advise applicants to examine the verbs they use."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own mple.", "Examine an alternative interpretation or limit.", "Conclude with a measured implication for readers."], "support": "guided", "starters": ["This text examines …", "A relevant limitation is …", "The evidence supports …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Жастар зерттеу бағдарламасына өтініш берушілерге мақала жазыңыз. Ойдан шығарылған түзету мысалы, нақты үлес, авторлық, құпиялылық және келесі сұрақ болсын.", "audienceKK": "мектеп журналының оқырмандары"}, {"id": "g11-t2", "grade": 11, "topic": 1, "category": "My home", "strand": "core", "title": "Whose Needs Shape a Shared Space", "genre": "essay", "model": "A proposal to convert a shared living room into a permanent workspace may promise efficiency while distributing costs unevenly. In an invented household, the room also supports exercise, visits, and a younger child's play. Treating these activities as interruptions assumes that one person's productivity matters most. A more careful decision begins by mapping actual use and distinguishing essential needs from flexible preferences. Temporary furniture and agreed quiet periods could be tested before an irreversible conversion. The review should ask whether each person can still study, rest, and participate without one activity routinely displacing another. This approach does not deny that space is limited or that some priorities may need to take precedence. It makes the reasons visible and gives affected people a role in revising the arrangement. Household decisions are not purely architectural; they involve power, time, and recognition. I therefore support a trial with explicit criteria and a realistic review date. A workable compromise may remain imperfect, yet it is stronger when its burdens can be discussed rather than hidden behind a supposedly neutral design choice. The aim is not equal use at every hour, but a reasoned and revisable distribution of shared space.", "words": 195, "independent": "Write an essay about an invented household creating a permanent recording corner. Analyse different needs, unequal effects, alternatives, and a reviewable compromise.", "audience": "readers of a class discussion journal", "goal": "Write an essay about a shared home space, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps establish a position and a question to examine. Evidence: A proposal to convert a shared living room into a permanent workspace may promise efficiency while distributing costs unevenly."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps reach a reasoned conclusion without overstating evidence. Evidence: The aim is not equal use at every hour, but a reasoned and revisable distribution of shared space."}], "bank": ["compromise", "priorities", "constraints", "review"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["A proposal to convert a shared living room into a permanent workspace may promise efficiency while distributing costs unevenly. In an invented household, the room also supports exercise, visits, and a younger child's play.", "This approach does not deny that space is limited or that some priorities may need to take precedence. It makes the reasons visible and gives affected people a role in revising the arrangement.", "A workable compromise may remai e confirmed some dates but could not resolve every remembered detail. Quotations were checked with contributors for the intended audience, and one private passage was removed. The project demonstrates that accuracy involves more than checking isolated facts. Selection and arrangement can change how a person's experience is understood. The small family sample does not justify conclusions about all people who move. Future writers should explain such limits and allow time for contributors to review sensitive passages. They should also distinguish permission to be interviewed from permission for a particular quotation to become public. Ethical storytelling preserves complexity while giving readers a clear account of what is known, remembered, inferred, or deliberately left private. A coherent essay need not force every voice into a single interpretation.", "words": 193, "independent": "Write a report evaluating an invented oral-history project about changing family work patterns. Include sources, conflicting perspectives, revision, permission, limits, and ethical recommendations.", "audience": "a school or project review group", "goal": "Write a report about an invented family experience, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the purpose and scope of a review. Evidence: This report examines the preparation of a fictional family-history essay about migration between two towns."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps summarise implications, limitations, or recommendations. Evidence: A coherent essay need not force every voice into a single interpretation."}], "bank": ["perspective", "attribution", "recollection", "context"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": " sal", "model": "Our fictional school is considering a digital portfolio for independent work across all subjects. We propose a limited trial before school-wide adoption. The trial should include pupils with varied access arrangements and teachers from subjects with different assessment practices. Its description must specify what evidence is stored, who can view it, and what non-digital alternative remains available. Review criteria should cover the quality of feedback, workload, accessibility, and privacy rather than only the number of uploads. Pupils should be able to comment without disclosing personal home circumstances to classmates. Teachers will keep brief workload notes, and the committee will report both benefits and barriers. The trial cannot establish that the same results will occur in every year group. It can identify useful features and questions requiring further investigation. A published review date will prevent a temporary arrangement from becoming permanent without discussion. Expansion should depend on evidence and revised design, not enthusiasm alone. This proposal supports purposeful digital learning while separating the educational goal from one submission method. A successful policy should preserve opportunities for participation and remain open to correction when its practical effects differ from the original promise.", "words": 190, "independent": "Write a proposal for an invented school-wide peer-feedback platform trial. Specify access, visibility, feedback quality, workload, alternatives, review criteria, and limits of generalisation.", "audience": "a school or club planning committee", "goal": "Write a proposal about a school improvement, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a need and a suggested course of action. Evidence: Our fictional school is considering a digital portfolio for independent work across all subjects."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps state review conditions or a reason for the recommendation. Evidence: A successful policy should preserve opportunities for participation and remain open to correction when its practical effects differ from the original promise."}], "bank": ["consultation", "accessibility", "criteria", "evaluation"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["This proposal supports purposeful digital learning while separating the educational goal from one submission method. A successful policy should preserve opportunities for participation and remain open to correction when its practical effects differ from the original promise.", "Our fictional school is considering a digital portfolio for independent work across all subjects. We propose a limited trial before school-wide adoption.", "Teachers will keep brief workload notes, and the committee will report both benefits and barriers. The trial cannot establish that the same results will occur in every year group."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Review criteria should cover the quality of feedback, workload, accessibility, and privacy _____ only the number of uploads.", "options": ["However", "rather than", "Therefore"], "answer": "rather than", "explanation": "The model uses “rather than”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, a ess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Мектептік өзара пікір платформасының ойдан шығарылған сынағын ұсыныңыз. Қолжетімділік, көріну, пікір сапасы, жүктеме, балама, шолу және жалпылау шектеуін анықтаңыз.", "audienceKK": "мектеп не үйірме жоспарлау комитеті"}, {"id": "g11-t5", "grade": 11, "topic": 4, "category": "My friends", "strand": "core", "title": "Loyalty without Intellectual Compliance", "genre": "essay", "model": "A friendship can be tested when one person asks another to endorse a claim they do not find convincing. In an invented example, a pupil wants her friend to sign a public statement about a school decision. The friend supports her right to speak but questions whether the evidence justifies the strongest accusation. Refusing to sign may feel disloyal, yet automatic agreement would misrepresent his judgement. A constructive response could offer private source checking and explain specific concerns without humiliating the writer publicly. The writer retains control of the final statement, while the friend retains control of his endorsement. This distinction does not make emotional support irrelevant. It makes support more precise: listening, offering help, and accepting disagreement are different actions from approving every conclusion. Neither person should have to surrender agency to prove that the relationship matters. I therefore reject the idea that loyalty requires intellectual compliance. A durable friendship can accommodate a reasoned boundary, although the conversation may remain uncomfortable. Its success should not be measured only by whether both people reach the same position, but by whether they can disagree without threats, coercion, or a demand for false agreement.", "words": 192, "independent": "Write an essay about an invented friend requesting public support for an unverified campaign claim. Distinguish support, evidence, endorsement, and personal agency, and address a counterargument.", "audience": "readers of a class discussion journal", "goal": "Write an essay about an invented friendship, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps establish a position and a question to examine. Evidence: A friendship can be tested when one person asks another to endorse a claim they do not find convincing."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps reach a reasoned conclusion without overstating evidence. Evidence: Its success should not be measured only by whether both people reach the same position, but by whether they can disagree without threats, coercion, or a demand for false agreement."}], "bank": ["boundary", "endorsement", "availability", "judgement"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["A friendship can be tested when one person asks another to endorse a claim they do not find convincing. In an invented example, a pupil wants her friend to sign a public statement about a school decision.", "This distinction does not make emotional support irrelevant. It makes support more precise: listening, offering help, and accepting disagreement are different actions from approving every conclusion.", "A durable friendship can accommodate a reasoned boundary, although the conversation may remain uncomfortable. Its success should not be measured only by whether both people reach the same position, but by whether they can disagree without threats, coercion, or a demand for false agreement."], "answer": "1-2-3", "explanation": "The selected extracts move from the opening to n. Do not grade the learner’s personal beliefs."}], "plan": ["State the question and your position.", "Develop reasons with concrete examples.", "Address a fair counterargument and a limitation.", "Reach a conclusion proportional to your evidence."], "support": "guided", "starters": ["This text examines …", "A relevant limitation is …", "The evidence supports …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Расталмаған науқан тұжырымын жария қолдауды сұраған ойдан шығарылған дос туралы эссе жазыңыз. Қолдау, дәлел, мақұлдау, дербестік және қарсы уәж болсын.", "audienceKK": "сыныптың талқылау журналының оқырмандары"}, {"id": "g11-t6", "grade": 11, "topic": 5, "category": "World around us", "strand": "core", "title": "From a Headline to an Evaluation", "genre": "article", "model": "A headline announcing that an initiative has transformed a local environment may go further than the evidence permits. In a fictional case, the figures describe the amount of waste collected during one event. That output matters, but it does not establish whether less waste later enters the area, how disposal was managed, or whether the intervention can be sustained. A careful writer should separate immediate activity from longer-term outcomes. This distinction is not intended to discourage volunteers. Accurate reporting can protect useful projects from expectations they cannot meet. The review should explain what was measured, over what period, and with which limitations. It could then suggest follow-up observations rather than fill the gaps with optimistic assumptions. Comparing similar locations might help, although other differences would still affect interpretation. Readers deserve to know the difference between a promising example and a demonstrated broad effect. An effective environmental article can therefore be persuasive without exaggeration. It can recognise effort, describe supported results, and identify the next evidence needed. Replacing an impressive but vague headline with a precise account gives future action a firmer foundation and makes later evaluation possible.", "words": 187, "independent": "Write an article evaluating an invented school's one-day water-saving campaign. Separate activity from outcomes, acknowledge uncertainty, and propose feasible follow-up without claiming causation.", "audience": "readers of a school magazine", "goal": "Write an article about a local environmental question, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence: A headline announcing that an initiative has transformed a local environment may go further than the evidence permits."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps bring the discussion to a supported conclusion. Evidence: Replacing an impressive but vague headline with a precise account gives future action a firmer foundation and makes later evaluation possible."}], "bank": ["measurement", "outcome", "comparison", "uncertainty"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["The review should explain what was measured, over what period, and with which limitations. It could then suggest follow-up observations rather than fill the gaps with optimistic assumptions.", "It can recognise effort, describe supported results, and identify the next evidence needed. Replacing an impressive but vague headline with a precise account gives future action a firmer foundation and makes later evaluation possible.", "A headline announcing that an initiative has transformed a local environment may go further than the evidence permits. In a fictional case, the figures describe the amount of waste collected during one event."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "An effective environmental article can _____ be persuasive without exaggeration.", "options": ["However", "Similarly", "therefore"], "answer": "therefore", "explanation": "The model uses “therefore”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Demanding more evidence could discourage a worthwhile environmental project. Recognising supported improvements while stating limits can strengthen useful action rather than dismiss it. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "One great event proves that the whole environmental problem has disappeared.", "answer": "Possible revision: The event produced a useful immediate result, but longer-term effects require further evidence. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["Introduce the issue and explain why it matters.", "Develop a claim with a relevant invented example.", "Examine an alternative interpretation or limit.", "Conclude with a measured implication for readers."], "support": "guided", "starters": ["This text examines …", "A relevant limitation is …", "The evidence supports …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Мектептің біркүндік су үнемдеу науқанын бағалайтын мақала жазыңыз. Әрекетті нәтижеден бөліп, белгісіздік пен орындалатын кейінгі бақылауды көрсетіңіз, себептілікке асықпаңыз.", "audienceKK": "мектеп журналының оқырмандары"}, {"id": "g11-t7", "grade": 11, "topic": 6, "category": "Kindness", "strand": "values", "title": "Solidarity That Leaves Others in Control", "genre": "proposal", "model": "Our student campaign proposes a partnership with a community organisation while recognising limits to our knowledge. Before deciding on publicity, students will ask the organisation to identify useful contributions and approve descriptions of its work. Service users will not be expected to supply personal stories as evidence of our success. Where someone independently wishes to contribute, the purpose, audience, and available alternatives will be explained. Declining will carry no disadvantage in receiving support. The campaign will report appropriate outcomes and practical feedback without implying that students understand every experience involved. A review after the first stage will consider whether donations created avoidable sorting or storage work. This is important because generosity can impose costs when it ignores local knowledge. The project will also record whose decisions shaped the plan, not only who appeared in photographs. Our aim is a useful relationship rather than an inspiring account centred on the volunteers. Success will mean that agreed support reaches its purpose and that partners retain meaningful control over how they are represented. Expansion will require renewed discussion instead of assuming that initial agreement covers every future idea. Solidarity can use our resources without taking ownership of another person's story.", "words": 197, "independent": "Write a proposal for an invented student partnership supporting a community language club. Include local knowledge, meaningful refusal, useful reporting, practical burdens, and renewed agreement before expansion.", "audience": "a school or club planning committee", "goal": "Write a proposal about a useful offer of help, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a need and a suggested course of action. Evidence: Our student campaign proposes a partnership with a community organisation while recognising limits to our knowledge."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps state review conditions or a reason for the recommendation. Evidence: Solidarity can use our resources without taking ownership of another person's story."}], "bank": ["dignity", "participation", "usefulness", "accountability"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Expansion will require renewed discussion instead of assuming that initial agreement covers every future idea. Solidarity can use our resources without taking ownership of another person's story.", "Our student campaign proposes a partnership with a community organisation while recognising limits to our knowledge. Before deciding on publicity, students will ask the organisation to identify useful contributions and approve descriptions of its work.", "A review after the first stage will consider whether donations created avoidable sorting or storage work. This is important because generosity can impose costs when it ignores local knowledge."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Expansion will require renewed discussion _____ of assuming that initial agreement covers every future idea.", "options": ["However", "instead", "Therefore"], "answer": "instead", "explanation": "The model uses “instead”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Personal stories can make a campaign easier for readers to understand. Stories are appropriate only when participation is informed, genuinely optional, and not a condition of support. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "We know exactly what everybody needs, so there is no reason to ask them.", "answer": "Possible revision: The organisers should consult participants before deciding which support would be useful. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["Define the need, audience, and aim.", "Describe actions, resources, and access. Explain risks, alternatives, and safeguards.", "State evaluation criteria and a realistic review."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Қоғамдық тіл үйірмесін қолдайтын ойдан шығарылған серіктестік ұсыныңыз. Жергілікті білім, еркін бас тарту, пайдалы есеп, жүктеме және кеңейтуге жаңа келісім болсын.", "audienceKK": "мектеп не үйірме жоспарлау комитеті"}, {"id": "g11-t8", "grade": 11, "topic": 7, "category": "Honesty", "strand": "values", "title": "Fluency Does Not Establish Truth", "genre": "essay", "model": "A fluent digital draft can create an impression of authority before its evidence has been examined. In a fictional group project, an AI tool produces a confident summary with plausible-looking references. Checking reveals that one source cannot be located and another does not support the attached claim. The group keeps a useful organisational idea but reconstructs the argument from materials it has actually read. It discloses the assistance and describes the verification completed. This process shows why naming a tool is not enough to establish academic integrity. Someone must still judge relevance, assess uncertainty, and take responsibility for the final wording. Nor does the example imply that every generated suggestion is unusable. Assistance can support learning when its role is clear and the writer retains meaningful control. The stronger standard is not whether technology appears in the process, but whether claims, attribution, and decision making can be explained. A polished paragraph should therefore be treated as a draft, not a conclusion. Intellectual honesty requires recognising the gap between language that sounds convincing and reasoning that can withstand independent scrutiny. Education should make that gap visible rather than reward confidence alone.", "words": 190, "independent": "Write an essay evaluating an invented AI-assisted literature summary. Discuss fluent language, source relevance, disclosure, writer responsibility, and a balanced counterargument about useful assistance.", "audience": "readers of a class discussion journal", "goal": "Write an essay about checking and correcting information, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps establish a position and a question to examine. Evidence: A fluent digital draft can create an impression of authority before its evidence has been examined."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps reach a reasoned conclusion without overstating evidence. Evidence: Education should make that gap visible rather than reward confidence alone."}], "bank": ["verification", "traceability", "disclosure", "accuracy"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["A fluent digital draft can create an impression of authority before its evidence has been examined. In a fictional group project, an AI tool produces a confident summary with plausible-looking references.", "Someone must still judge relevance, assess uncertainty, and take responsibility for the final wording. Nor does the example imply that every generated suggestion is unusable.", "Intellectual honesty requires recognising the gap between language that sounds convincing and reasoning that can withstand independent scrutiny. Education should make that gap visible rather than reward confidence alone."], "answer": "1-2-3", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "A polished paragraph should _____ be treated as a draft, not a conclusion.", "options": ["therefore", "However", "Similarly"], "answer": "therefore", "explanation": "The model uses “therefore”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Checking every minor suggestion can make drafting slower. Writers should prioritise claims that affect the argument and remain responsible for what they publish. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "The text sounds clever, so all its sources must be true.", "answer": "Possible revision: Fluent wording does not establish source reliability; the claims and references still need checking. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["State the question and your position.", "Develop reasons with concrete examples. Address a fair counterargument and a limitation.", "Reach a conclusion proportional to your evidence."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "ЖИ көмектескен ойдан шығарылған әдебиет шолуын бағалайтын эссе жазыңыз. Жатық тіл, дерек сәйкестігі, ашық көрсету, автор жауапкершілігі және пайдалы көмекке қарсы уәж болсын.", "audienceKK": "сыныптың талқылау журналының оқырмандары"}, {"id": "g11-t9", "grade": 11, "topic": 8, "category": "Respect", "strand": "values", "title": "Respect When Authority Is Unequal", "genre": "article", "model": "A consultation can sound polite while still preventing some participants from influencing the outcome. In an invented school meeting, an adult dismisses a pupil's concern as inexperience, and a pupil labels a staff concern as resistance to change. Both responses replace examination of the claim with a judgement about the speaker. A facilitator can ask each side to identify its reasons, evidence, and practical consequences. However, this routine should not pretend that everyone holds equal decision-making power. The institution must also explain who makes the final choice and how contributions will be considered. Listening is not identical to agreement, but authority is not a sufficient answer to a reasonable question. Respectful participation requires protection against ridicule and freedom not to disclose personal experiences publicly. It also needs a visible connection between the discussion and the decision. A careful record can show what was accepted, rejected, or left unresolved and why. This makes consultation more than an invitation to speak. It becomes a process whose fairness can be examined, particularly by people who were heard politely but may otherwise have no way to question what happened next.", "words": 186, "independent": "Write an article analysing an invented consultation about study-space rules. Address unequal authority, respectful challenge, private experience, decision reasons, and follow-up.", "audience": "readers of a school magazine", "goal": "Write an article about respectful communication, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence: A consultation can sound polite while still preventing some participants from influencing the outcome."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps bring the discussion to a supported conclusion. Evidence: It becomes a process whose fairness can be examined, particularly by people who were heard politely but may otherwise have no way to question what happened next."}], "bank": ["authority", "reasoning", "representation", "dialogue"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Listening is not identical to agreement, but authority is not a sufficient answer to a reasonable question. Respectful participation requires protection against ridicule and freedom not to disclose personal experiences publicly.", "This makes consultation more than an invitation to speak. It becomes a process whose fairness can be examined, particularly by people who were heard politely but may otherwise have no way to question what happened next.", "A consultation can sound polite while still preventing some participants from influencing the outcome. In an invented school meeting, an adult dismisses a pupil's concern as inexperience, and a pupil labels a staff concern as resistance to change."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "_____, this routine should not pretend that everyone holds equal decision-making power.", "options": ["Therefore", "Similarly", "However"], "answer": "However", "explanation": "The model uses “However”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Decision-makers must act even when agreement is impossible. Authority can decide while still giving reasons and showing how concerns were considered. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "They are too inexperienced to have any useful concern.", "answer": "Possible revision: The concern should be assessed through its reasons and evidence rather than the speaker's status. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["Introduce the issue and explain why it matters.", "Develop a claim with a relevant invented example. Examine an alternative interpretation or limit.", "Conclude with a measured implication for readers."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Оқу кеңістігі ережелерін талқылайтын ойдан шығарылған кеңесуді талдаңыз. Тең емес өкілеттік, сыйластық, жеке тәжірибе, шешім себептері және кейінгі әрекет болсын.", "audienceKK": "мектеп журналының оқырмандары"}, {"id": "g11-t10", "grade": 11, "topic": 9, "category": "Responsibility", "strand": "values", "title": "Responsibility after a Helpful Guide Causes Confusion", "genre": "formal letter", "model": "Dear student resource committee, I am writing about the application guide prepared for our fictional careers week. Several readers have identified a deadline error and wording that may mislead applicants about eligibility. Please verify these entries promptly and publish a visible explanation of any corrections. Updating the file alone may not reach pupils who downloaded or received the earlier version. The channels that shared it should therefore be asked to circulate the correction. I appreciate that the guide was created to help learners, but good intentions do not remove the practical effects of inaccurate information. A review should examine how the errors entered the process and assign independent checks for high-impact details in future editions. Please also provide a straightforward way to raise concerns without requiring applicants to disclose private circumstances publicly. No checking process can guarantee perfection. It can, however, make responsibilities explicit and corrections easier to follow. Thank you for considering repair, communication, and prevention together rather than treating the issue only as a matter of reputation. A response centred on readers' decisions would strengthen the resource's usefulness and demonstrate accountability for its continuing effects. Yours faithfully, A Student Reviewer.", "words": 192, "independent": "Write a formal letter about an invented apprenticeship information booklet with misleading requirements. Request verification, visible correction, wider updates, accessible feedback, and process changes without alleging intent.", "audience": "the relevant school or club committee", "goal": "Write a formal letter about following through on a commitment, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the reason for writing to a decision-maker. Evidence: Dear student resource committee, I am writing about the application guide prepared for our fictional careers week."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps make a clear request and close respectfully. Evidence: Yours faithfully, A Student Reviewer."}], "bank": ["correction", "consequence", "prevention", "accountability"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["A response centred on readers' decisions would strengthen the resource's usefulness and demonstrate accountability for its continuing effects. Yours faithfully, A Student Reviewer.", "Dear student resource committee, I am writing about the application guide prepared for our fictional careers week. Several readers have identified a deadline error and wording that may mislead applicants about eligibility.", "A review should examine how the errors entered the process and assign independent checks for high-impact details in future editions. Please also provide a straightforward way to raise concerns without requiring applicants to disclose private circumstances publicly."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "It can, _____, make responsibilities explicit and corrections easier to follow.", "options": ["Similarly", "however", "Therefore"], "answer": "however", "explanation": "The model uses “however”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: A publication cannot prevent every error or later change. A visible correction process and proportionate checking still reduce avoidable harm. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "We meant well, so the wrong information is not our problem.", "answer": "Possible revision: Good intentions do not remove the need to correct inaccurate information and address its effects. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["Address the relevant organiser or committee.", "Explain the concern and supporting details. Request specific realistic actions without assuming motives.", "Invite a response and close formally."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Ойдан шығарылған тағылымдама кітапшасындағы жаңылыстыратын талаптарға ресми хат жазыңыз. Ниетті айыптамай, тексеру, ашық түзету, жаңарту, қолжетімді пікір және өзгеріс сұраңыз.", "audienceKK": "тиісті мектеп не үйірме комитеті"}, {"id": "g11-t11", "grade": 11, "topic": 10, "category": "Teamwork", "strand": "values", "title": "A Team Should Survive a Change of Availability", "genre": "report", "model": "This report reviews a fictional research team's response when one member reduced her involvement. Important notes were stored only on her device, so the remaining members could not continue smoothly. The group initially blamed the individual before recognising that its workflow had created a single point of dependence. With her agreement, shared materials were transferred, decisions documented, and credit clarified for work already completed. Future checkpoints were redesigned so that each member could understand the main argument rather than only one section. The change improved continuity but required time and did not make everyone equally available. The case illustrates a difference between goodwill and a resilient process. A team cannot reasonably assume that personal circumstances will remain unchanged throughout a project. It should establish shared access to appropriate materials, respect privacy, and agree how changes in responsibility will be discussed. Credit should reflect actual contribution rather than attendance at the final presentation alone. These recommendations support collective knowledge without treating individuals as interchangeable. Collaboration is stronger when the process can adapt to limits while preserving both the work and the dignity of the people involved.", "words": 185, "independent": "Write a report on an invented magazine team adapting after a designer's reduced availability. Include workflow weakness, agreed transfer, credit, privacy, revised checkpoints, and limits.", "audience": "a school or project review group", "goal": "Write a report about a shared project, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the purpose and scope of a review. Evidence: This report reviews a fictional research team's response when one member reduced her involvement."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps summarise implications, limitations, or recommendations. Evidence: Collaboration is stronger when the process can adapt to limits while preserving both the work and the dignity of the people involved."}], "bank": ["contribution", "workflow", "continuity", "credit"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["This report reviews a fictional research team's response when one member reduced her involvement. Important notes were stored only on her device, so the remaining members could not continue smoothly.", "The case illustrates a difference between goodwill and a resilient process. A team cannot reasonably assume that personal circumstances will remain unchanged throughout a project.", "These recommendations support collective knowledge without treating individuals as interchangeable. Collaboration is stronger when the process can adapt to limits while preserving both the work and the dignity of the people involved."], "answer": "1-2-3", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Future checkpoints were redesigned so that each member could understand the main argument _____ only one section.", "options": ["rather than", "Therefore", "However"], "answer": "rather than", "explanation": "The model uses “rather than”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Recording contributions can add bureaucracy. Brief relevant notes can support fair credit without ranking every minute of work. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "Only the person who talks on stage has done any real work.", "answer": "Possible revision: Credit should reflect documented contributions, including preparation that is not publicly visible. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["State purpose, scope, and fictional method.", "Present findings with clear examples. Distinguish evidence from interpretation and limits.", "Give recommendations linked to findings."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Дизайнердің қатысуы азайған ойдан шығарылған журнал тобына есеп жазыңыз. Үдеріс әлсіздігі, келісілген беру, авторлық, құпиялылық, жаңа тексеру және шектеу болсын.", "audienceKK": "мектептік не жобалық шолу тобы"}, {"id": "g11-t12", "grade": 11, "topic": 11, "category": "Fairness", "strand": "values", "title": "When a Criterion Measures Opportunity", "genre": "essay", "model": "A selection rule can be transparent and still produce unfair effects if its measures reflect unequal access. In a fictional workshop application, points for unpaid experience appear to reward commitment. Yet the opportunity to work without pay may depend on transport, available time, and family finances. Experience can therefore act as a proxy for advantages that the programme does not intend to assess. This does not mean experience is irrelevant or that standards should disappear. It means reviewers should ask what a criterion actually measures and which alternative evidence could demonstrate the intended quality. A revised system might accept community, home, and informal project examples, while requiring applicants to explain actions and learning. Reviewers should record reasons and provide a route for questioning decisions. Such changes do not eliminate subjectivity. They make it more explicit and reviewable. Testing the system with fictional cases can reveal effects before real applicants bear the consequences. I support numerical tools when their limits are acknowledged, not when their appearance of precision substitutes for judgement. Fairness requires examining both the rule and the conditions that shape a person's opportunity to satisfy it.", "words": 187, "independent": "Write an essay evaluating an invented award that rewards travel-based experiences. Analyse opportunity as a proxy, relevant alternatives, transparent judgement, review, and a counterargument.", "audience": "readers of a class discussion journal", "goal": "Write an essay about fair access to an opportunity, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps establish a position and a question to examine. Evidence: A selection rule can be transparent and still produce unfair effects if its measures reflect unequal access."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps reach a reasoned conclusion without ov
