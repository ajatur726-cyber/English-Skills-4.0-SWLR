 new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Мектеп көрмесінің орнын сынап көруді ұсынатын электрондық хат жазыңыз. Бақылау, балама және шолу жоспарын қосыңыз.", "audienceKK": "тапсырмада аталған үйірме ұйымдастырушысы, мектеп не жоба тобы"}, {"id": "g7-t5", "grade": 7, "topic": 4, "category": "My friends", "strand": "core", "title": "When Silence Is Not Rejection", "genre": "advice", "model": "If a friend replies slowly, avoid deciding immediately that you have upset them. They may be busy, tired, or helping at home. In one invented example, a pupil sent several worried messages before learning that his friend was caring for a sibling. A calm conversation helped them agree on realistic expectations. You can ask whether a better time would suit the other person, but you do not need to demand private details. Friendship includes attention and care, yet it should also leave room for responsibilities outside the friendship. Ask, listen, and allow time for a reply.", "words": 96, "independent": "Write advice for an invented class newsletter about a friend declining invitations during a busy period. Include a possible explanation, a respectful question, and a boundary.", "audience": "readers of a school advice page", "goal": "Write advice about an invented friendship, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a situation readers may face. Evidence: If a friend replies slowly, avoid deciding immediately that you have upset them."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps leave a practical action with appropriate limits. Evidence: Ask, listen, and allow ti opic": 8, "category": "Respect", "strand": "values", "title": "A Story Is Not a Whole Country", "genre": "opinion", "model": "Reading about one family can help us understand an experience, but it cannot show how every person in a country lives. In our class, a story about a celebration led to a broad claim about all families from that place. Returning to the passage helped us see its limits. It described particular people with their own preferences. I think respectful discussion should ask what the text shows and what it leaves unknown. We can be curious about differences without treating one example as a rule. Specific questions produce better understanding than confident stereotypes.", "words": 93, "independent": "Write an opinion paragraph about avoiding stereotypes when reading an invented school-exchange diary. Distinguish one person's experience from a whole community.", "audience": "readers of a class opinion collection", "goal": "Write an opinion text about respectful communication, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps state a position about the topic. Evidence: Reading about one family can help us understand an experience, but it cannot show how every person in a country lives."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps offer a reasoned conclusion or recommendation. Evidence: Specific questions produce better understanding than confident stereotypes."}], "bank": ["authority", "reasoning", "representation", "dialogue"], "linkers": ["for example", "however", "therefore"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Reading about one family can help us understand an experience, but it cannot show how every person in a country lives.", "It descri ner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Мектеп алмасу күнделігін оқу кезінде стереотиптен сақтану туралы пікір жазыңыз. Жеке тәжірибені тұтас қауымнан ажыратыңыз.", "audienceKK": "сынып пікір жинағының оқырмандары"}, {"id": "g7-t10", "grade": 7, "topic": 9, "category": "Responsibility", "strand": "values", "title": "An Apology with a Repair Plan", "genre": "email", "model": "Dear group, I am sorry I did not send my section yesterday. This delayed your checking, and I understand that it affected the whole report. My introduction is complete, but the final example still needs a source check. I will share the current draft now and finish the checked version by five this evening. If that timing creates another problem, please tell me so we can adjust the plan. For the next stage, I will send progress updates earlier. I want to repair the practical delay, not only explain that I was busy. Best wishes, Amir.", "words": 96, "independent": "Write an email from an invented pupil who missed a rehearsal-planning deadline. Acknowledge the effect, state progress, and offer a realistic repair plan.", "audience": "the project team", "goal": "Write an email about following through on a commitment, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a purpose for a named recipient. Evidence: Dear group, I am sorry I did not send my section yesterday."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps give a request, next step, or appropriate close. Evidence: I want to repair the practical delay, not only explain that I was busy."}], "bank": ["correction", "consequence", "prevention", "accountability"], "linkers": ["for example", "however", "therefore"], "practice": [{"type": "order", "pro anguage, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Дайындық мерзімін өткізіп алған ойдан шығарылған оқушының хатын жазыңыз. Салдарын мойындап, ілгерілеу мен түзету жоспарын көрсетіңіз.", "audienceKK": "тапсырмада аталған үйірме ұйымдастырушысы, мектеп не жоба тобы"}, {"id": "g7-t11", "grade": 7, "topic": 10, "category": "Teamwork", "strand": "values", "title": "Two Endings One Team", "genre": "story", "model": "Our group could not agree on the ending of a short film. I wanted a surprise, while another member wanted a clear explanation. Instead of voting immediately, we wrote down what each ending would help the audience understand. We showed both outlines to two classmates and listened to their questions. The final version combined a short surprise with one extra scene explaining the character's choice. It was not exactly what either of us had first imagined. Working together did not remove disagreement; it gave us a way to use disagreement without turning it into a personal argument.", "words": 97, "independent": "Write an invented story about combining two ideas for a school exhibition. Include a disagreement, a test with users, and a revised solution.", "audience": "readers of a class story collection", "goal": "Write a story about a shared project, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a character and situation. Evidence: Our group could not agree on the ending of a short film."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps show an outcome or something learned. Evidence: Working together did not remove disagreement; it gave us a way to use disagreement without turning it into a personal argument."}], "bank": ["contribution", "workflow", "continuity", "credit"], "linkers": ["for example", "however", "therefore"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Working together did not remove disagreement; it gave us a way to use disagreement without turning it into a personal argument.", "Our group could not agree on the ending of a short film.", "We showed both outlines to two classmates and listened to their questions."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "_____ of voting immediately, we wrote down what each ending would help the audience understand.", "options": ["However", "Instead", "Therefore"], "answer": "Instead", "explanation": "The model uses “Instead”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Rewrite this vague informal feedback politely and specifically for the model writer: “This is good, but some bits need work.” Refer to one actual detail.", "source": "Keep the main purpose: helpful feedback for a peer.", "answer": "Possible response: The detail “We showed both outlines to two classmates and listened to their questions.” gives the reader useful information. Could you explain its effect more clearly? Other specific, polite suggestions are accepted.", "explanation": "Teacher review only: check register, a concrete reference, and a useful suggestion rather than one fixed wording."}], "plan": ["Introduce an invented character and setting.", "Describe a problem or unexpected event. Show the action taken and its effect.", "End with an outcome or a lesson grounded in events."], "support": "developing", "starters": ["I am writing to …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Мектеп көрмесіне екі идеяны біріктірген ойдан шығарылған топ туралы жазыңыз. Келіспеу, пайдаланушы сынағы және жаңа шешім болсын.", "audienceKK": "сыныптың әңгімелер жинағын оқитындар"}, {"id": "g7-t12", "grade": 7, "topic": 11, "category": "Fairness", "strand": "values", "title": "An Application Everyone Can Reach", "genre": "email", "model": "Dear club committee, your helper application asks pupils to print a form and deliver it at lunchtime. Some interested pupils cannot print at home, and others have lunchtime responsibilities. Could you offer a digital form and a second delivery time? These changes would not alter the selection criteria. They would simply make applying possible for more pupils. A short trial could show whether the extra options are manageable. Please also display the criteria clearly so that everyone knows what evidence to include. Thank you for considering access as part of a fair process. Yours sincerely, A Club Member.", "words": 98, "independent": "Write an email proposing fairer access to an invented school competition registration. Keep the same selection standards while reducing practical barriers.", "audience": "the selection committee", "goal": "Write an email about fair access to an opportunity, using details and an ending anation": "Teacher review only: check register, a concrete reference, and a useful suggestion rather than one fixed wording."}], "plan": ["Address the intended person or group.", "Explain the reason and relevant example. Make a realistic request or suggestion.", "State a next step and use an appropriate close."], "support": "developing", "starters": ["I am writing to …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Мектеп байқауына тіркелудегі кедергілерді азайтатын хат жазыңыз. Іріктеу талаптарын өзгертпей, қолжетімділікті жақсартыңыз.", "audienceKK": "тапсырмада аталған үйірме ұйымдастырушысы, мектеп не жоба тобы"}, {"id": "g7-t13", "grade": 7, "topic": 12, "category": "Gratitude", "strand": "values", "title": "Naming the Work behind the Show", "genre": "email", "model": "Dear exhibition team, thank you for helping our class share its work. The presenters received applause, but we also noticed the planning that visitors did not see. You moved tables, checked the lights, and helped us repair a broken display stand. Because the room was ready, we could focus on explaining our projects. We would like to name those contributions in the school newsletter, with your agreement. Please tell us how you would prefer to be credited. Our success depended on more than the people standing beside the posters. With appreciation, The Project Group.", "words": 94, "independent": "Write a detailed thank-you email to an invented team supporting a school performance. Name contributions, explain their effects, and ask how contributors prefer to be acknowledged.", "audience": "the event helpers", "goal": "Write an email about specific appreciation, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a purpose for a named recipient. Evidence: Dear exhibition team, thank you for helping our class share its work."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps give a request, next step, or appropriate close. Evidence: With appreciation, The Project Group."}], "bank": ["acknowledgement", "specificity", "complexity", "contribution"], "linkers": ["for example", "however", "therefore"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["We would like to name those contributions in the school newsletter, with your agreement.", "With appreciation, The Project Group.", "Dear exhibition team, thank you for helping our class share its work."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "_____ the room was ready, we could focus on explaining our projects.", "options": ["Therefore", "However", "Because"], "answer": "Because", "explanation": "The model uses “Because”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Rewrite this vague informal feedback politely and specifically for the model writer: “This is good, but some bits need work.” Refer to one actual detail.", "source": "Keep the main purpose: helpful feedback for a peer.", "answer": "Possible response: The detail “We would like to name those contributions in the school newsletter, with your agreement.” gives the reader useful information. Could you explain its effect more clearly? Other specific, polite suggestions are accepted.", "explanation": "Teacher review only: check register, a concrete reference, and a useful suggestion rather than one fixed wording."}], "plan": ["Address the intended person or group.", "Explain the reason and relevant example. Make a realistic request or suggestion.", "State a next step and use an appropriate close."], "support": "developing", "starters": ["I am writing to …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Ойдан шығарылған қойылымды қолдаған топқа алғыс хатын жазыңыз. Нақты үлес, әсер және қалай аталуын сұрау болсын.", "audienceKK": "тапсырмада аталған үйірме ұйымдастырушысы, мектеп не жоба тобы"}, {"id": "g7-t14", "grade": 7, "topic": 13, "category": "Digital kindness", "strand": "digital", "title": "Ask before You Assume a Tone", "genre": "advice", "model": "Short online messages can be difficult to interpret because readers cannot always hear the writer's tone. If a reply sounds abrupt, pause before answering angrily. A neutral question may reveal that the person was rushing or referring to an earlier conversation. This does not mean ignoring clear or repeated harm. It means separating what the words actually say from what you imagine about the writer's intention. In a class discussion space, respond to the idea and ask for clarification when needed. A private question can sometimes prevent an unnecessary public argument.", "words": 91, "independent": "Write advice for an invented class chat about responding to an unclear comment. Distinguish ambiguity from repeated harmful behaviour.", "audience": "readers of a school advice page", "goal": "Write advice about considerate online communication, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a situation readers may face. Evidence: Short online messages can be difficult to interpret because readers cannot always hear the writer's tone."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps leave a practical action with appropriate limits. Evidence: A private question can sometimes prevent an unnecessary public argument."}], "bank": ["amplification", "context", "audience", "intervention"], "linkers": ["for example", "however", "therefore"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["A private question can sometimes prevent an unnecessary public argument.", "Short online messages can be difficult to interpret because readers cannot always hear the writer's tone.", "This does not mean ignoring clear or repeated harm."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Short online messages can be difficult to interpret _____ readers cannot always hear the writer's tone.", "options": ["However", "because", "Therefore"], "answer": "because", "explanation": "The model uses “because”. Discuss whether it marks contrast, cause, time, or an alternative. In independen nd support", "strand": "digital", "title": "A Bystander Can Offer a Choice", "genre": "support message", "model": "Hi, Alex. I have noticed repeated mocking comments in the group, and I am concerned about how they may affect you. I will not forward them or start a public argument. If you would like, I can accompany you to a trusted teacher and help explain what I saw. An adult can advise us about keeping relevant evidence securely and using reporting tools. You do not have to stay in the chat to prove what is happening. Please tell me what support would feel useful, and we can agree on a next step together.", "words": 94, "independent": "Write to an invented pupil targeted in an online hobby group. Offer a choice, adult support, and an alternative way to receive updates.", "audience": "an invented pupil who may want support", "goal": "Write a support message about support after fictional online harm, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps acknowledge a fictional concern without blaming. Evidence: I have noticed repeated mocking comments in the group, and I am concerned about how they may affect you."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps offer choice, trusted support, or follow-up. Evidence: Please tell me what support would feel useful, and we can agree on a next step together."}], "bank": ["confidentiality", "participation", "follow-up", "evaluation"], "linkers": ["for example", "however", "therefore"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["An adult can advise us about keeping relevant evidence securely and using reporting tools.", "Please tell me what support would feel useful, and we can agree on a next step together.", "I have noticed rep guage, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Досының жеке жаңалығын байқаусыз таратқан жағдайға кеңес жазыңыз. Түзету, кешірім, таңдау және шынайы күту көрсетілсін.", "audienceKK": "мектеп кеңес парағының оқырмандары"}, {"id": "g8-t6", "grade": 8, "topic": 5, "category": "World around us", "strand": "core", "title": "From One Photograph to a Useful Plan", "genre": "opinion", "model": "A photograph of litter can draw attention to a park, but it cannot show how conditions change throughout a week. In our imagined club study, pupils observed the same three locations at different times and recorded when bins were full. Their notes suggested a collection problem near the busiest entrance. The study was small, so the group proposed a trial rather than claiming to explain every cause of litter. I support this approach because it connects an emotional first impression with specific evidence. Good environmental action can begin with concern, but a useful plan needs observation, clear limits, and a way to review results.", "words": 104, "independent": "Write an opinion text about investigating an invented school water-waste concern. Distinguish an initial impression from evidence and propose a limited trial.", "audience": "readers of a class opinion collection", "goal": "Write an opinion text about a local environmental question, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps state a position about the topic. Evidence: A photograph of litter can draw attention to a park, but it cannot show how conditions change throughout a week."}, {"q": "H anguage, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Ойдан шығарылған оқушылар кеңесіне сыйластық талқылау тәртібін ұсыныңыз. Нақты қадам, пайда және қорғаныс шарты болсын.", "audienceKK": "сынып пікір жинағының оқырмандары"}, {"id": "g8-t10", "grade": 8, "topic": 9, "category": "Responsibility", "strand": "values", "title": "Responsibility for a Digital Draft", "genre": "email", "model": "Hi, reading-club team. I found a problem in the worksheet I prepared with a digital drafting tool. One question asks for information that the passage does not contain. I have removed it and checked every remaining answer against the text. I am sorry that the question frustrated our younger readers. For the next session, I suggest a second review before we print any material. I selected the worksheet, so blaming the tool would not repair the activity. Please send me any other unclear items you noticed, and I will share the corrected version this afternoon. Best wishes, Aida.", "words": 98, "independent": "Write a team email about an invented digital draft containing a misleading instruction. Acknowledge responsibility and explain correction and prevention.", "audience": "the project team", "goal": "Write an email about following through on a commitment, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a purpose for a named recipient. Evidence: I found a problem in the worksheet I prepared with a digital drafting tool."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps give a request, next step, or appropriate close. Evidence: Please send me any other unclear items you noticed, and I will share the corrected version this afternoon."}], "bank": ["correction", "consequence", "pre ording."}], "plan": ["Decide the purpose, audience, and essential details for the new task.", "Choose your own structure and test whether every part serves that purpose."], "support": "independent", "starters": [], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Шағымнан кейін жағымсыз пікірлері жалғасқан ойдан шығарылған оқушыға қолдау жазыңыз. Ересек көмегі, қатысуды сақтау және қайта байланыс болсын.", "audienceKK": "қолдау қажет болуы мүмкін ойдан шығарылған оқушы"}, {"id": "g9-t1", "grade": 9, "topic": 0, "category": "About myself", "strand": "core", "title": "Learning Is Part of My Profile", "genre": "article", "model": "A personal profile should show more than a list of successful activities. When I introduced myself to a youth writing group, I described a reading project that had initially attracted only two participants. I had chosen a meeting time without asking other pupils about their routines. After collecting suggestions, I moved the meeting and offered shorter sessions. Attendance improved, although the group remained small. This experience taught me to investigate a problem before assuming that others lacked interest. I now want to develop clearer questions and learn how to report feedback accurately. My contribution to the workshop would be careful preparation and a willingness to revise. I would also like to hear how other participants have changed an unsuccessful plan. A profile cannot explain an entire person, but it can show a specific decision, a limitation, and a continuing learning goal. Those details make an introduction more credible than an unsupported claim to be naturally talent rnative interpretation or limit.", "Conclude with a measured implication for readers."], "support": "guided", "starters": ["This text examines …", "A relevant limitation is …", "The evidence supports …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Жастар медиа тобына өтініш беретін ойдан шығарылған адам туралы мақала жазыңыз. Шағын жоба, қате, түзету және келесі мақсат болсын.", "audienceKK": "мектеп журналының оқырмандары"}, {"id": "g9-t2", "grade": 9, "topic": 1, "category": "My home", "strand": "core", "title": "A Practical Choice for a Shared Home", "genre": "essay", "model": "A home improvement should be judged by the needs it meets, not only by how attractive it looks. Consider an invented household planning to replace a shared table. A smaller model would create more floor space, but it would also reduce the surface used for homework and sewing. The family could compare replacement with repair and better storage. Repair might cost less, although its safety and durability would need checking. The decision should include everyone who regularly uses the room. Otherwise, one person's idea of tidiness may remove another person's essential workspace. I would recommend listing activities, comparing realistic options, and testing a temporary arrangement before purchasing. No choice will satisfy every preference. However, a transparent discussion can make the reasons and compromises clear. A useful improvement makes everyday life more manageable and can be reviewed when circumstances change, rather than being defended simply because money has already been spent.", "words": 150, "independent": "Write an e ks, alternatives, and safeguards.", "State evaluation criteria and a realistic review."], "support": "guided", "starters": ["This text examines …", "A relevant limitation is …", "The evidence supports …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Сынып жабдықтарының белгілерін жақсартатын ойдан шығарылған сынақ ұсыныңыз. Мәселе, қолжетімді дизайн, ресурс, бағалау және шектеуді көрсетіңіз.", "audienceKK": "мектеп не үйірме жоспарлау комитеті"}, {"id": "g9-t5", "grade": 9, "topic": 4, "category": "My friends", "strand": "core", "title": "Honest Feedback between Friends", "genre": "article", "model": "Giving a friend useful feedback can feel more difficult than praising the work. In an invented example, a pupil reviews a competition speech and notices that one example does not support the main claim. Remaining silent would avoid immediate discomfort, but it would not help the writer prepare. The reviewer first asks whether detailed feedback is welcome at that moment. She then identifies the specific gap and explains its effect on the audience. She offers possible revisions without insisting that her own wording must be used. This approach separates support for the person from agreement with every sentence. Timing also matters: a long list of changes just before speaking may be less useful than one priority discussed earlier. Friendship does not require constant approval. It can include careful criticism when the writer retains control over the final choice. The strongest feedback is specific, respectful, and connected to what the task is trying to achieve.", "words": 154, "independent": "Write an article about an invented pupil giving feedback on a friend's poster. Include permission, one concrete issue, timing, and the writer's right to choose.", "audience": "readers of a school magazine", "goal": "Write an article about an invented friendship, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence: Giving a friend useful feedback can feel more difficult than praising the work."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps bring the discussion to a supported conclusion. Evidence: The strongest feedback is specific, respectful, and connected to what the task is trying to achieve."}], "bank": ["boundary", "endorsement", "availability", "judgement"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["She offers possible revisions without insisting that her own wording must be used. This approach separates support for the person from agreement with every sentence.", "It can include careful criticism when the writer retains control over the final choice. The strongest feedback is specific, respectful, and connected to what the task is trying to achieve.", "Giving a friend useful feedback can feel more difficult than praising the work. In an invented example, a pupil reviews a competition speech and notices that one example does not support the main claim."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in s. It allows us to communicate results while recognising that people receiving help should remain free to choose how their circumstances are represented.", "words": 152, "independent": "Write a proposal for an invented school fundraiser supporting a community reading space. Include consultation, useful support, consent, and realistic evaluation.", "audience": "a school or club planning committee", "goal": "Write a proposal about a useful offer of help, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a need and a suggested course of action. Evidence: Our volunteer club wants to raise supplies for a community service without making private stories part of the donation request."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps state review conditions or a reason for the recommendation. Evidence: It allows us to communicate results while recognising that people receiving help should remain free to choose how their circumstances are represented."}], "bank": ["dignity", "participation", "usefulness", "accountability"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Our volunteer club wants to raise supplies for a community service without making private stories part of the donation request. We propose a campaign based on information approved by the service organiser.", "The campaign will not promise to solve every difficulty faced by the service. Its success will be reviewed through useful items delivered and feedback from the organiser.", "This approach keeps kindness connected to actual needs. It allows us to communicate results while recognising that people receiving help should rema og, record the exact claim each source supports, and flag uncertainty before rehearsal. A traceable source does not answer every question, but it gives readers a clearer basis for evaluating what is being claimed.", "words": 154, "independent": "Write a report about an invented infographic project that removed an unverified quotation. Include the checking method, correction, and prevention.", "audience": "a school or project review group", "goal": "Write a report about checking and correcting information, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the purpose and scope of a review. Evidence: This report explains a source-checking decision during a fictional debate project."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps summarise implications, limitations, or recommendations. Evidence: A traceable source does not answer every question, but it gives readers a clearer basis for evaluating what is being claimed."}], "bank": ["verification", "traceability", "disclosure", "accuracy"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["The revised speech also described a limitation in that evidence. This change reduced certainty but improved the argument's reliability.", "Future teams should keep a source log, record the exact claim each source supports, and flag uncertainty before rehearsal. A traceable source does not answer every question, but it gives readers a clearer basis for evaluating what is being claimed.", "This report explains a source-checking decision during a fictional debate project. The team found a statistic that strongly supported its argument, but the website off iscussion routines that combine respectful treatment with critical questioning. The aim is neither unanimous agreement nor a contest in confidence. It is a clearer understanding of what can reasonably be concluded and what remains open to investigation.", "words": 147, "independent": "Write an essay about respectful disagreement in an invented school discussion on technology. Distinguish personal dignity, evidence, and the right not to disclose private experiences.", "audience": "readers of a class discussion journal", "goal": "Write an essay about respectful communication, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps establish a position and a question to examine. Evidence: Disagreeing with a claim does not necessarily disrespect the speaker."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps reach a reasoned conclusion without overstating evidence. Evidence: It is a clearer understanding of what can reasonably be concluded and what remains open to investigation."}], "bank": ["authority", "reasoning", "representation", "dialogue"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["The aim is neither unanimous agreement nor a contest in confidence. It is a clearer understanding of what can reasonably be concluded and what remains open to investigation.", "Disagreeing with a claim does not necessarily disrespect the speaker. A person deserves considerate treatment, while a statement can still require evidence and clarification.", "Polite language alone is not enough if harmful assumptions remain unexamined. A facilitator should help participants identify the specific words, likely effects, a y: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["State the question and your position.", "Develop reasons with concrete examples. Address a fair counterargument and a limitation.", "Reach a conclusion proportional to your evidence."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Технология жайлы ойдан шығарылған мектеп талқылауындағы сыйластыққа эссе жазыңыз. Қадір-қасиет, дәлел және жеке тәжірибені ашпау құқығын ажыратыңыз.", "audienceKK": "сыныптың талқылау журналының оқырмандары"}, {"id": "g9-t10", "grade": 9, "topic": 9, "category": "Responsibility", "strand": "values", "title": "Correcting a Public Guide", "genre": "formal letter", "model": "Dear school newsletter editor, I am writing about the study-space guide published last week. The entry for the community library gives an opening time that is no longer current. I checked the detail with the library desk this morning. Please review the entry and add a visible correction so that readers who saved the earlier version can update their plans. It would also help to include the date on which practical information was checked. I recognise that schedules can change after publication, and I am not suggesting that the mistake was deliberate. Nevertheless, the guide should make corrections easy to find. For future editions, a short review schedule could identify details that need regular checking. Please let me know whether you need the confirmation note I received. Thank you for considering a change that would make this useful resource more reliable for everyone using it. Yours faithfully, A Student Reader.", "words": 150, "independent": "Write a formal letter about an invented school event guide with an incorrect venue. Request a visible correction and a future checking process.", "audience": "the relevant school or club committee", "goal": "Write a formal letter about following through on a commitment, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the reason for writing to a decision-maker. Evidence: Dear school newsletter editor, I am writing about the study-space guide published last week."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps make a clear request and close respectfully. Evidence: Yours faithfully, A Student Reader."}], "bank": ["correction", "consequence", "prevention", "accountability"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Dear school newsletter editor, I am writing about the study-space guide published last week. The entry for the community library gives an opening time that is no longer current.", "I recognise that schedules can change after publication, and I am not suggesting that the mistake was deliberate. Nevertheless, the guide should make corrections easy to find.", "Thank you for considering a change that would make this useful resource more reliable for everyone using it. Yours faithfully, A Student Reader."], "answer": "1-2-3", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing rnatives for absentees, and realistic limits.", "audience": "a school or club planning committee", "goal": "Write a proposal about fair access to an opportunity, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a need and a suggested course of action. Evidence: Our school speaking competition provides the same topic and deadline to all entrants, but access to preparation differs."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps state review conditions or a reason for the recommendation. Evidence: Fairness improves when relevant information is shared openly rather than passed through informal networks that some learners cannot reach."}], "bank": ["opportunity", "criterion", "proxy", "transparency"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["The organising team should check that the session time is accessible and provide a summary for pupils who cannot attend. Fairness improves when relevant information is shared openly rather than passed through informal networks that some learners cannot reach.", "Our school speaking competition provides the same topic and deadline to all entrants, but access to preparation differs. Some pupils know the assessment criteria, while others have never seen an example performance.", "These measures will not guarantee equal results or remove the need for effort. Their purpose is to make expectations transparent and reduce avoidable uncertainty."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your , audience, and aim.", "Describe actions, resources, and access. Explain risks, alternatives, and safeguards.", "State evaluation criteria and a realistic review."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Ойдан шығарылған эссе байқауына әділ дайындық ұсыныңыз. Ортақ талаптар, қолжетімді жаттығу, қатыса алмағандарға балама және шектеу болсын.", "audienceKK": "мектеп не үйірме жоспарлау комитеті"}, {"id": "g9-t13", "grade": 9, "topic": 12, "category": "Gratitude", "strand": "values", "title": "The Exhibition behind the Photograph", "genre": "article", "model": "A photograph of our imaginary school exhibition shows confident pupils beside bright posters. It does not show the technician who repaired a light, the cleaner who prepared the floor, or the volunteer who organised the chairs. A short article praising only the visible presenters would therefore tell an incomplete story. To improve our account, we interviewed contributors and asked how they wanted to be acknowledged. We included specific actions and explained how they supported the event. This did not reduce the pupils' achievements. It placed them within the network of work that made the exhibition possible. Gratitude can improve reporting when it encourages a writer to notice overlooked contributions. However, appreciation should not become an excuse to exaggerate or publish personal information without permission. A careful thank-you describes what happened, credits the people involved, and leaves room for their preferences about being named.", "words": 143, "independent": "Write y work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "_____, appreciation should not become an excuse to exaggerate or publish personal information without permission.", "options": ["However", "Therefore", "Similarly"], "answer": "However", "explanation": "The model uses “However”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: A celebratory message should not become a list of institutional problems. Specific appreciation can remain positive without claiming that every experience was perfect. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "Everything was perfect for everyone, so nobody should mention a difficulty.", "answer": "Possible revision: Specific appreciation can recognise support without claiming that every experience was identical. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["Introduce the issue and explain why it matters.", "Develop a claim with a relevant invented example. Examine an alternative interpretation or limit.", "Conclude with a measured implication for readers."], "support": "developing", "starters": ["This text examines …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Ойдан шығарылған мектеп подкаст фестиваліндегі елеусіз еңбекті мойындайтын мақала жазыңыз. Рөлдер, әсер және атын көрсету рұқсатын қамтыңыз.", "audienceKK": "мектеп журналының оқырмандары"}, {"id": "g9-t14", "grade": 9, "topic": 13, "category": "Digital kindness", "strand": "digital", "title": "When a Joke Has No Safe Exit", "genre": "article", "model": "Online humour can create connection, but repeated jokes about one pupil may work very differently from mutual play. In an invented group chat, a popular account keeps targeting a quieter member. Other users argue that the laughing reactions prove everyone is enjoying it. They do not establish the targeted person's consent, especially if objecting leads to further ridicule. A useful response examines whether people can refuse safely and whether the pattern creates unequal pressure. Viewers should avoid forwarding harmful material simply to ask a wider audience to judge it. Private support and an appropriate trusted adult may be more helpful than a public argument. This does not mean that every awkward joke is identical to sustained harassment. It means that intention and popularity are insufficient tests. Responsible participants consider the repeated behaviour, its effects, and the choices genuinely available to the person receiving it.", "words": 14 oice, and review questions.", "audience": "a school or project review group", "goal": "Write a report about permission and personal information, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the purpose and scope of a review. Evidence: Our class compared two fictional study-reminder tools."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps summarise implications, limitations, or recommendations. Evidence: A visually attractive interface is not a substitute for an understandable account of how a tool uses information."}], "bank": ["consent", "purpose", "retention", "alternative"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Future reviewers should ask what information is collected, how long it is kept, who can access it, and whether the same learning goal can be met with less collection. A visually attractive interface is not a substitute for an understandable account of how a tool uses information.", "Our class compared two fictional study-reminder tools. Both could display a countdown, but one requested contacts, location, and a detailed activity history.", "We chose the simpler option for the class exercise and did not submit personal information. This review did not establish that every data request was harmful or that the first tool could never have a legitimate use."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model uish selection from exaggeration.", "audience": "readers of a school magazine", "goal": "Write an article about an invented learner’s interests and goals, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence: A portfolio can become a misleading advertisement if it displays only polished outcomes and hides every revision."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps bring the discussion to a supported conclusion. Evidence: The next version will include a clearer review date and a short explanation of the project's limitations."}], "bank": ["reflection", "evidence", "agency", "revision"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["It showed how I made decisions and what remained unresolved. A reader could judge my learning more clearly than from a photograph described simply as a great success.", "I would rather demonstrate careful revision than claim a talent that the work cannot establish. The next version will include a clearer review date and a short explanation of the project's limitations.", "A portfolio can become a misleading advertisement if it displays only polished outcomes and hides every revision. For an imagined youth-design application, I selected one project that changed after feedback."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas." ffects on different members and recommend a reviewable decision process.", "audience": "readers of a class discussion journal", "goal": "Write an essay about a shared home space, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps establish a position and a question to examine. Evidence: Moving closer to school may appear obviously beneficial when only a pupil's travel time is considered."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps reach a reasoned conclusion without overstating evidence. Evidence: It can be a responsible response when information is incomplete and the consequences are shared across a household."}], "bank": ["compromise", "priorities", "constraints", "review"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["A provisional choice is not necessarily weak. It can be a responsible response when information is incomplete and the consequences are shared across a household.", "Moving closer to school may appear obviously beneficial when only a pupil's travel time is considered. In an invented household, however, the proposed flat increases rent and lengthens another member's commute.", "This does not mean that a move should never happen. Some benefits could outweigh the disadvantages, especially if circumstances change."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "In an invented household, _____, the proposed flat increases rent and lengthens another member's commute.", "options": ["Similarly", "however", "Therefore"], "answer": "however", "explanation": "The model uses “however”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Households cannot satisfy every preference in a limited space. Transparent priorities and a reviewable trial can make unavoidable trade-offs more accountable. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "This arrangement is perfect for everyone, and anyone who disagrees is wrong.", "answer": "Possible revision: This arrangement may meet several needs, but its effects should be reviewed with all users. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["State the question and your position.", "Develop reasons with concrete examples.", "Address a fair counterargument and a limitation.", "Reach a conclusion proportional to your evidence."], "support": "guided", "starters": ["This text examines …", "A relevant limitation is …", "The evidence supports …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Тыныш, бірақ алыс үйге көшуді қарастыратын ойдан шығарылған отбасы туралы эссе жазыңыз. Әртүрлі әсерлерді салыстырып, қайта қаралатын шешім ұсыныңыз.", "audienceKK": "сыныптың талқылау журналының оқырмандары"}, {"id": "g10-t3", "grade": 10, "topic": 2, "category": "My family", "strand": "core", "title": "Care Is More than a Financial Contribution", "genre": "report", "model": "This report summarises a fictional interview project about how families describe care. Three invented participants discussed money, time, transport, and emotional support. Their answers challenged the assumption that the largest financial contribution always represented the greatest effort. One account described regular journeys to appointments, while another concerned helping a younger relative study. The report does not rank these activities or present one household arrangement as ideal. The sample is small, and memories cannot establish how every responsibility was experienced. Nevertheless, the interviews show why a narrow measure can overlook important work. Quotations were reviewed by the speakers, and identifying details were removed. Future projects should distinguish description from judgement and avoid asking participants to disclose information they would rather keep private. Researchers could also ask how responsibilities change over time. Recognising care requires attention to the conditions under which it is given, including whether people have genuine choices and whether their contribution affects access to education or employment.", "words": 158, "independent": "Write a report on an invented interview project about non-financial family contributions. Include method, contrasting examples, limits, permission, and further questions.", "audience": "a school or project review group", "goal": "Write a report about an invented family experience, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the purpose and scope of a review. Evidence: This report summarises a fictional interview project about how families describe care."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps summarise implications, limitations, or recommendations. Evidence: Recognising care requires attention to the conditions under which it is given, including whether people have genuine choices and whether their contribution affects access to education or employment."}], "bank": ["perspective", "attribution", "recollection", "context"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["This report summarises a fictional interview project about how families describe care. Three invented participants discussed money, time, transport, and emotional support.", "The sample is small, and memories cannot establish how every responsibility was experienced. Nevertheless, the interviews show why a narrow measure can overlook important work.", "Researchers could also ask how responsibilities change over time. Recognising care requires attention to the conditions under which it is given, including whether people have genuine choices and whether their contribution affects access to education or emplo are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["State purpose, scope, and fictional method.", "Present findings with clear examples.", "Distinguish evidence from interpretation and limits.", "Give recommendations linked to findings."], "support": "guided", "starters": ["This text examines …", "A relevant limitation is …", "The evidence supports …"], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Отбасындағы қаржылық емес үлес туралы ойдан шығарылған сұхбат жобасына есеп жазыңыз. Әдіс, қарама-қарсы мысал, шектеу, рұқсат және жаңа сұрақ болсын.", "audienceKK": "мектептік не жобалық шолу тобы"}, {"id": "g10-t4", "grade": 10, "topic": 3, "category": "My school", "strand": "core", "title": "Consultation Starts with a Clear Question", "genre": "proposal", "model": "Our school is considering a supervised independent-study period, but early consultation has produced conflicting answers. Comments suggest that pupils imagine different arrangements: some expect quiet support, while others picture unstructured free time. We propose rewriting the description before collecting further opinions. The revised document should explain supervision, resources, duration, and how the period connects to learning. Questions should then ask about conditions for success rather than demand a simple yes or no. A limited trial could collect pupil feedback and teacher workload notes, with no requirement to disclose private home circumstances. The review date and decision criteria should be published in advance. This process will not predict every effect or manufacture agreement. It will provide evidence about a clearly defined proposal. If substantial barriers remain, the school should revise the design rather than interpret criticism as resistance to learning. Good consultation depends on whether people understand what they are being asked to evaluate and can explain the reasons for their response.", "words": 161, "independent": "Write a proposal for consulting pupils about an invented peer-tutoring period. Clarify the design, gather varied feedback, and define a limited trial and review.", "audience": "a school or club planning committee", "goal": "Write a proposal about a school improvement, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a need and a suggested course of action. Evidence: Our school is considering a supervised independent-study period, but early consultation has produced conflicting answers."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps state review conditions or a reason for the recommendation. Evidence: Good consultation depends on whether people understand what they are being asked to evaluate and can explain the reasons for their response."}], "bank": ["consultation", "accessibility", "criteria", "evaluation"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["A limited trial could collect pupil feedback and teacher workload notes, with no requirement to disclose private home circumstances. The review date and decision criteria should be published in advance.", "If substantial barriers remain, the school should revise the design rather than interpret criticism as resistance to learning. Good consultation depends on whether people understand what they are being asked to evaluate and can explain the reasons for their response.", "Our school is considering a supervised independent-study period, but early consultation has produced conflicting answers. Comments suggest that pupils imagine different arrangements: some expect quiet support, while others picture unstructured free time."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Questions should then ask about conditions for success _____ demand a simple yes or no.", "options": ["Therefore", "However", "rather than"], "answer": "rather than", "explanation": "The model uses “rather than”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: A trial or consultation takes staff time and may delay a useful change. A limited design with clear criteria can make the time proportionate to the risks. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model to y messages. They agree to state urgency clearly and avoid demanding explanations for every period of silence. This does not remove the need to be considerate. Repeatedly ignoring an agreed commitment may still require discussion. However, care should not depend on continuous access to another person's attention. A sustainable friendship includes limits that both people can understand and revise. Young writers can describe these limits without portraying either friend as selfish or perfect. The useful lesson is not that phones always damage relationships. It is that assumptions about availability should be made explicit before they become hidden tests. A respectful boundary can preserve connection by making expectations more realistic.", "words": 155, "independent": "Write an article about an invented friendship affected by competing study and family responsibilities. Discuss explicit expectations, urgency, and revisable boundaries.", "audience": "readers of a school magazine", "goal": "Write an article about an invented friendship, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence: Constant messaging can turn an unspoken expectation into pressure between friends."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps bring the discussion to a supported conclusion. Evidence: A respectful boundary can preserve connection by making expectations more realistic."}], "bank": ["boundary", "endorsement", "availability", "judgement"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["It is that assumptions about availability should be made explicit before they rison period and how the reduction was measured. A narrow improvement may be valuable without proving every broader conclusion. Rejecting the entire initiative would be as careless as accepting the slogan automatically. A balanced review can acknowledge the documented change while identifying unanswered questions. It should distinguish outputs, such as material reduced, from longer-term outcomes that require separate evidence. This approach makes environmental communication more credible and gives readers a clearer basis for action. Writers do not need to sound certain about what remains unknown. They need to explain what can reasonably be concluded, what additional information would matter, and why the distinction changes the strength of the claim. Precision can support genuine improvement rather than weaken it.", "words": 162, "independent": "Write an article evaluating an invented school's energy-saving headline. Separate a measured change in one building from claims about the whole school and explain missing evidence.", "audience": "readers of a school magazine", "goal": "Write an article about a local environmental question, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence: An advertisement reports that a fictional product now uses lighter packaging."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps bring the discussion to a supported conclusion. Evidence: Precision can support genuine improvement rather than weaken it."}], "bank": ["measurement", "outcome", "comparison", "uncertainty"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["An advertisement reports that a fictional product now uses lighter packaging. The headline turns this limited change into a claim of complete sustainability.", "A balanced review can acknowledge the documented change while identifying unanswered questions. It should distinguish outputs, such as material reduced, from longer-term outcomes that require separate evidence.", "They need to explain what can reasonably be concluded, what additional information would matter, and why the distinction changes the strength of the claim. Precision can support genuine improvement rather than weaken it."], "answer": "1-2-3", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Precision can support genuine improvement _____ weaken it.", "options": ["rather than", "Therefore", "However"], "answer": "rather than", "explanation": "The model uses “rather than”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Demanding more evidence could discourage a worthwhile environmental project. Recognising supported improvements while stating limits can strengthen useful action rather than dismiss it. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern. he organiser to identify useful support and approve factual descriptions. Personal stories will not be required as proof that assistance has been delivered. Anyone considering a contribution will receive a clear explanation of the audience and purpose, with a genuine option to decline. Refusal will not affect access to the service. The campaign can report quantities, volunteer tasks, and feedback without identifying recipients. We will also ask whether donated materials create storage or sorting work. A review after the first delivery will guide any expansion. This design does not promise to solve every challenge facing the service. It connects a manageable contribution with accountability for its effects. Students will learn that kindness includes accepting limits to their knowledge and allowing others to shape the project. A successful partnership should remain useful even when no participant wishes to appear in publicity.", "words": 158, "independent": "Write a proposal for an invented youth partnership with a community repair workshop. Include consultation, useful support, non-identifying reporting, refusal without penalty, and review.", "audience": "a school or club planning committee", "goal": "Write a proposal about a useful offer of help, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a need and a suggested course of action. Evidence: Our youth organisation proposes a partnership with a community reading service."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps state review conditions or a reason for the recommendation. Evidence: A successful partnership should remain useful even when no participant wishes to appear in publicity."}], "bank": ["dignity", "participation", "usefulness", "accountability"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["We will also ask whether donated materials create storage or sorting work. A review after the first delivery will guide any expansion.", "Students will learn that kindness includes accepting limits to their knowledge and allowing others to shape the project. A successful partnership should remain useful even when no participant wishes to appear in publicity.", "Our youth organisation proposes a partnership with a community reading service. Before promoting the campaign, we will ask the organiser to identify useful support and approve factual descriptions."], "answer": "3-1-2", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "gap", "prompt": "Restore the exact missing word from the model.", "source": "We will also ask whether donated _____ create storage or sorting work.", "answer": "materials", "explanation": "Use the wording in the model to reconstruct this sentence. Equivalent ideas may use different words in your independent draft."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Personal stories can make a campaign easier for readers to understand. Stories are appropriate only when participation is informed, genuinely optional, and not a condition of support. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type"
