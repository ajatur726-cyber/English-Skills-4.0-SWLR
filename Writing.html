і жанама өлшеу, балама, анық пайым, шолу және қарсы уәжді талдаңыз.", "audienceKK": "сыныптың талқылау журналының оқырмандары"}, {"id": "g11-t13", "grade": 11, "topic": 12, "category": "Gratitude", "strand": "values", "title": "A Graduation Speech with Room for Complexity", "genre": "article", "model": "Gratitude does not require claiming that an institution has served every person equally well. In an invented graduation speech, an early draft presents school life as an uncomplicated success story. Classmates explain that they valued particular support while also encountering barriers. The writers revise the speech to name concrete contributions without describing every experience as identical. They thank people whose routine work made opportunities possible and ask how individuals prefer to be acknowledged. The result is less sweeping but more credible. Criticism does not cancel appreciation, just as appreciation should not silence reasonable concerns. A careful speech can recognise help and strengthen the case for making future opportunities more accessible. The challenge is to avoid using vague praise as a substitute for evidence or turning other people's private experiences into emotional decoration. Writers can select specific actions and explain their effects without demanding personal disclosure from the whole class. Gratitude then becomes a form of accurate attention: it notices who contributed, how the contribution mattered, and what complexity should remain visible. A sincere thank-you can be generous without pretending that there is nothing left to improve.", "words": 186, "independent": "Write an article advising an invented graduating class on a thank-you speech. Include concrete credit, varied experiences, privacy, criticism, and credible appreciation.", "audience": "readers of a school magazine", "goal": "Write an article about specific appreciation, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps introduce a central issue for readers. Evidence: Gratitude does not require claiming that an institution has served every person equally well."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps bring the discussion to a supported conclusion. Evidence: A sincere thank-you can be generous without pretending that there is nothing left to improve."}], "bank": ["acknowledgement", "specificity", "complexity", "contribution"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Gratitude then becomes a form of accurate attention: it notices who contributed, how the contribution mattered, and what complexity should remain visible. A sincere thank-you can be generous without pretending that there is nothing left to improve.", "Gratitude does not require claiming that an institution has served every person equally well. In an invented graduation speech, an early draft presents school life as an uncomplicated success story.", "Criticism does not cancel appreciation, just as appreciation should not silence reasonable concerns. A careful speech can recognise help and strengthen the case for making future opportunities more accessible."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Classmates explain that they valued particular support _____ also encountering barriers.", "options": ["However", "while", "Therefore"], "answer": "while", "explanation": "The mod ail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "I _____ argue that responsible participation should be evaluated through foreseeable effects as well as stated intentions.", "options": ["therefore", "However", "Similarly"], "answer": "therefore", "explanation": "The model uses “therefore”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Public attention can help expose harmful behaviour. The issue can often be discussed without reproducing identifying or humiliating content. Adapt to the genre and actual issue.", "explanation": "Teacher review only: the counterpoint should be fair and relevant, and the response should give a reason rather than dismiss the concern."}, {"type": "open", "skill": "register", "prompt": "Edit this fictional draft line into a measured formal sentence suited to the model topic. Keep any reasonable point, remove exaggeration or disrespect, and explain one language change.", "source": "I shared it to be nice, so it cannot have caused more harm.", "answer": "Possible revision: Supportive intentions do not prevent wider distribution from increasing exposure for the person targeted. Explain a change in certainty, register, or evidence. Other accurate, respectful versions are accepted.", "explanation": "Teacher review only: assess editing, appropriate register, justified certainty, and an explanation of the revision. Do not grade the learner’s personal beliefs."}], "plan": ["Decide the purpose, audience, and essential details for the new task.", "Choose your own structure and test whether every part serves that purpose."], "support": "independent", "starters": [], "teacher": "Use the model as an example of structure and language, not a script to copy. Accept different names, details, positions, and solutions when they fit the new situation, remain coherent, and are supported where needed. Assess communication and language, not the learner's moral beliefs. For sensitive themes use fictional situations and never require disclosure of personal distress.", "independentKK": "Оқушыны нысанаға алған ойдан шығарылған реакция-видео үрдісі туралы эссе жазыңыз. Аудитория жауапкершілігі, әсер, таратпай сөйлеу және хабардарлық туралы қарсы уәж болсын.", "audienceKK": "сыныптың талқылау журналының оқырмандары"}, {"id": "g11-t15", "grade": 11, "topic": 14, "category": "Privacy and consent", "strand": "digital", "title": "Collect Less by Designing the Task Differently", "genre": "proposal", "model": "Our class proposes a reading practice website that does not collect identifying learner information. The first design included names, school details, and email addresses, but the learning activity did not require them. We will remove that form and let pupils complete exercises on their own devices without registration. Draft responses can remain locally for the session, with a clear explanation if optional browser storage is used. The design will not promise that every educational service can avoid all information collection. Instead, each request must be justified against a defined purpose and compared with a less intrusive alternative. Before release, the team will check that no external form or unnecessary tracking script has been added. Teachers can assess work through agreed classroom methods rather than a public submission system. A short review will examine whether the activity remains usable when storage is unavailable. This approach places privacy within the architecture of the task instead of treating it as a notice added at the end. The project will also explain its limits honestly: local storage is not an account system, and pupils should not enter personal or sensitive information into practice fields.", "words": 190, "independent": "Write a proposal for an invented offline vocabulary website that avoids unnecessary data collection. Include purpose limitation, local drafts, storage failure, teacher assessment, technical checks, and honest limits.", "audience": "a school or club planning committee", "goal": "Write a proposal about permission and personal information, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify a need and a suggested course of action. Evidence: Our class proposes a reading practice website that does not collect identifying learner information."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps state review conditions or a reason for the recommendation. Evidence: The project will also explain its limits honestly: local storage is not an account system, and pupils should not enter personal or sensitive information into practice fields."}], "bank": ["consent", "purpose", "retention", "alternative"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["Instead, each request must be justified against a defined purpose and compared with a less intrusive alternative. Before release, the team will check that no external form or unnecessary tracking script has been added.", "This approach places privacy within the architecture of the task instead ntacts, secure handling of relevant evidence, appropriate platform controls, and another route to class communication when necessary. Pupils were not required to recount distressing experiences to a public group or remain in harmful spaces to prove the pattern. The review found that a written policy was useful only when its implementation could be questioned and adjusted. No single action guaranteed immediate removal of content. Evaluation therefore focused on safety, manageable support, and continued participation as well as procedural completion. Future reviews should explain how information is protected and how pupils can raise concerns about the response itself. This approach does not replace established school procedures. It shows why evidence about a process must include the experiences of those it is intended to protect, without turning evaluation into another source of exposure. The strongest response remains practical, reviewable, and sensitive to the learner's choices.", "words": 195, "independent": "Write a report evaluating an invented youth club's anti-harassment process. Address ambiguous report counts, confidential feedback, access, secure evidence, follow-up, and evaluation without personal disclosure.", "audience": "a school or project review group", "goal": "Write a report about support after fictional online harm, using details and an ending suited to the reader.", "notice": [{"q": "How does the opening establish the purpose or situation? Quote a useful phrase.", "answer": "The opening helps identify the purpose and scope of a review. Evidence: This report reviews an invented school's approach to repeated online harassment."}, {"q": "How does the ending complete the text? Explain its role using the wording.", "answer": "The ending helps summarise implications, limitations, or recommendations. Evidence: The strongest response remains practical, reviewable, and sensitive to the learner's choices."}], "bank": ["confidentiality", "participation", "follow-up", "evaluation"], "linkers": ["nevertheless", "in contrast", "this suggests", "within these limits"], "practice": [{"type": "order", "prompt": "Restore these extracts to the order in which they appear in the model. Use each number once.", "source": ["It shows why evidence about a process must include the experiences of those it is intended to protect, without turning evaluation into another source of exposure. The strongest response remains practical, reviewable, and sensitive to the learner's choices.", "This report reviews an invented school's approach to repeated online harassment. The review did not use report counts alone as a measure of success.", "The review found that a written policy was useful only when its implementation could be questioned and adjusted. No single action guaranteed immediate removal of content."], "answer": "2-3-1", "explanation": "The selected extracts move from the opening to a middle detail and then the closing. This exercise reconstructs the model; other paragraph arrangements may work in your own writing."}, {"type": "choice", "prompt": "Which expression restores the exact link used in the model? Look at the surrounding ideas.", "source": "Evaluation _____ focused on safety, manageable support, and continued participation as well as procedural completion.", "options": ["Similarly", "therefore", "However"], "answer": "therefore", "explanation": "The model uses “therefore”. Discuss whether it marks contrast, cause, time, or an alternative. In independent writing, another expression may be valid if the relationship and grammar remain clear."}, {"type": "open", "prompt": "Add a fair counterpoint and a reasoned response to the model discussion. For a report, proposal, or letter, frame them as a limitation and how it can be addressed.", "source": "Do not invent a real statistic. Use an explicitly fictional example if needed.", "answer": "Possible direction: Formal reports and controls are important parts of a response. They should be function paragraphs(text,g){if(g<=4)return `<p>${esc(text)}</p>`;let greeting='',closing='',body=text;const gm=body.match(/^(Dear[^,]{0,70},|Hi, [^.]{0,30}\.)\s*/);if(gm){greeting=gm[1];body=body.slice(gm[0].length)}const cm=body.match(/\s((?:Best wishes|Yours sincerely|Yours faithfully|With appreciation|Your friend|Best),[^.]+\.?)$/);if(cm){closing=cm[1];body=body.slice(0,cm.index)}let ss=body.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[body],parts=[];const step=g>=9?3:4;for(let i=0;i<ss.length;i+=step)parts.push(ss.slice(i,i+step).join('').trim());return (greeting?`<p>${esc(greeting)}</p>`:'')+parts.map(p=>`<p>${esc(p)}</p>`).join('')+(closing?`<p>${esc(closing)}</p>`:'')}
function planInstructions(u){if(state.lang==='en')return u.plan;const base=t().genericPlan;const genre=GENRE_KK[u.genre];const special={story:['Кейіпкер мен орынды таныстырыңыз.','Қиындықты және оған жауап берген әрекетті жоспарлаңыз.','Оқиғаларды ретімен байланыстырыңыз.','Нәтиже мен оқиғадан туатын ойды көрсетіңіз.'],report:['Есептің мақсаты мен ойдан шығарылған әдісін анықтаңыз.','Нәтижелерге нақты мысалдар дайындаңыз.','Дәлелді пайымнан бөліп, шектеулерді көрсетіңіз.','Нәтижеге сай ұсыныстармен аяқтаңыз.'],proposal:['Қажеттілікті, аудиторияны және мақсатты анықтаңыз.','Әрекет, ресурс және қолжетімділікті жоспарлаңыз.','Тәуекел, балама және қорғаныс шараларын көрсетіңіз.','Бағалау өлшемі мен шолу уақытын белгілеңіз.'],essay:['Негізгі сұрақ пен ұстанымды анықтаңыз.','Себептерді нақты мысалдармен дамытыңыз.','Орынды қарсы уәжге жауап беріп, шектеуді мойындаңыз.','Дәлел күшіне сай қорытынды жазыңыз.'],'formal letter':['Тиісті ұйымдастырушыға не комитетке жүгініңіз.','Мәселе мен дәлел болатын бөлшектерді түсіндіріңіз.','Ниетті айыптамай, нақты орындалатын әрекет сұраңыз.','Жауапқа шақырып, ресми түрде аяқтаңыз.']};const a=special[u.genre]||base;if(u.support==='guided')return a;if(u.support==='developing')return [a[0],a[1]+' '+a[2],a[3]];return ['Жаңа тапсырмаға сай мақсат, оқырман және қажетті бөлшектерді өзіңіз анықтаңыз.','Өз құрылымыңызды таңдап, әр бөліктің мақсатқа қызмет етуін тексеріңіз.']}
function prompt(p,u){if(state.lang==='en')return p.type==='order'&&u.grade>=9?'Restore these paragraph extracts to their order in the model. Use each number once.':p.prompt;if(p.type==='reorder')return 'Сөздерді үлгідегідей реттеңіз. Соңғы тыныс белгісін қойыңыз.';if(p.type==='edit')return 'Бас әріптер мен соңғы тыныс белгісін үлгідегідей қалпына келтіріңіз.';if(p.type==='gap')return 'Үлгідегі нақты жетіспейтін сөзді жазыңыз.';if(p.type==='choice')return 'Үлгідегі байланысты дәл қалпына келтіретін тіркесті таңдаңыз. Айналасындағы ойларды оқыңыз.';if(p.type==='order')return (u.grade>=9?'Абзацтық үзінділерді':'Үзінділерді')+' үлгіде кездесетін ретімен орналастырыңыз. Әр нөмірді бір рет пайдаланыңыз.';if(p.skill==='register')return 'Ойдан шығарылған сөйлемді тақырыпқа сай ресми әрі байыпты етіп редакциялаңыз. Әсірелеу мен сыйламайтын тұжырымды өзгертіп, бір тілдік түзетуді түсіндіріңіз.';if(u.grade<=6)return 'Үлгіден бір нақты бөлшек таңдап, оның негізгі ойды қалай қолдайтынын бір-екі сөйлеммен түсіндіріңіз.';if(u.grade<=8)return '«This is good, but some bits need work» деген жалпылама пікірді нақты әрі сыпайы етіп өзгертіңіз. Үлгінің бір нақты бөлшегіне сүйеніңіз.';return 'Орынды қарсы уәж бен негізделген жауап қосыңыз. Есеп, ұсыныс не хатта оны шектеу және оған жауап ретінде беріңіз. Нақты өмірге қатысты ойдан сан шығармаңыз.'}
function explain(p){if(state.lang==='en')return p.explanation;if(p.type==='reorder')return 'Бұл жаттығуда үлгінің нақты сөз реті қалпына келтіріледі. Сөйлем басы мен әрекет орнын тексеріңіз.';if(p.type==='edit')return 'Сөйлем басын, I сөзін, есімдерді және соңғы тыныс белгісін үлгімен салыстырыңыз.';if(p.type==='gap')return 'Мұнда үлгінің дәл сөзі қажет. Ал дербес жазылымда мағынасы сәйкес басқа сөздерді қолдануға болады.';if(p.type==='choice')return 'Үлгі осы тіркесті қолданады. Оның қарсылықты, себепті, уақытты не баламаны білдіретінін талқылаңыз. Өз мәтініңізде грамматикасы мен мағынасы сәйкес басқа байланыс та жарамды.';if(p.type==='order')return 'Үзінділер үлгінің басынан ортаңғы бөлшекке, кейін аяқталуына өтеді. Өз мәтініңізде басқа негізді құрылым болуы мүмкін.';return 'Бұл жауапты мұғалім талдайды. Мағынасы, мәтінге сүйенуі және жанрға сайлығы бағаланады; бір ғана тұжырым міндетті емес.'}
function practiceInput(p,i,u){const val=entry(u).practice?.[i]||'',id='practice'+i;let fields='';if(p.type==='choice')fields=`<div class="options">${p.options.map(o=>`<label class="choice" lang="en"><input type="radio" name="${id}" data-field="practice" data-index="${i}" value="${esc(o)}" ${val===o?'checked':''}>${esc(o)}</label>`).join('')}</div>`;else if(p.type==='order'){const selected=String(val).split('-');fields=`<div class="order-grid">${t().positions.map((pos,j)=>`<label>${pos}<select aria-label="${pos}" data-field="order" data-index="${i}" data-position="${j}"><option value=""></option>${[1,2,3].map(n=>`<option value="${n}" ${selected[j]===String(n)?'selected':''}>${n}</option>`).join('')}</select></label>`).join('')}</div>`}else if(p.type==='open')fields=`<textarea id="${id}" data-field="practice" data-index="${i}" aria-label="${esc(prompt(p,u))}" placeholder="${state.lang==='kk'?'Жауабыңызды ағылшынша жазыңыз…':'Write your response in English…'}">${esc(val)}</textarea>`;else fields=`<input type="text" id="${id}" data-field="practice" data-index="${i}" value="${esc(val)}" autocomplete="off" aria-label="${esc(prompt(p,u))}">`;
const source=Array.isArray(p.source)?p.source.map((s,j)=>`<div class="extract" lang="en"><strong>${j+1}.</strong> ${esc(s)}</div>`).join(''):`<div class="source" lang="en">${esc(p.source)}</div>`;return `<fieldset class="task" id="practiceField${i}"><legend><span class="tasktype">${i+1}. ${t().closedTypes[p.type]}${p.type==='open'?' · '+t().openLabel:''}</span>${esc(prompt(p,u))}</legend>${source}${fields}<div class="feedback" id="feedback${i}"></div>${state.answers?`<div class="model"><strong>${t().sample}:</strong> <span lang="en">${esc(p.answer)}</span><p>${esc(explain(p))}</p></div>`:''}</fieldset>`}
function rubricData(g){const kk=state.lang==='kk',level=g<=4?0:g<=6?1:g<=8?2:3;const names=kk?['Мазмұн және міндет','Ұйымдастыру және байланыс','Сөздік қор','Грамматика және тыныс белгілері']:['Task content','Organisation and cohesion','Vocabulary','Grammar and punctuation'];const strongEN=[['Includes the requested simple details for the invented reader.','Uses a short, understandable sequence of sentences'+(g===4?' with simple links.':'.'),'Uses familiar words and concrete details appropriately.','Uses understandable short clauses, capitals and final punctuation.'],['Completes the purpose with relevant details and an example.','Organises a paragraph or letter logically with suitable opening, links and ending.','Uses topic vocabulary precisely enough for the reader and avoids distracting repetition.','Controls common sentence patterns and punctuation; errors rarely obstruct meaning.'],['Addresses purpose and audience with developed details, reasons or useful advice.','Organises paragraphs and genre features with purposeful links and a clear ending.','Chooses vocabulary and register suited to the reader, with some variety.','Uses a range of sentence patterns; grammar and punctuation support clear meaning.'],['Develops a clear purpose with relevant evidence or explicitly fictional examples; acknowledges appropriate limits'+(g===11?' and qualifies conclusions carefully.':'.'),'Sustains a coherent genre structure; connects claims, evidence, alternatives and conclusion.','Uses precise academic or formal language while keeping the register appropriate and readable.','Uses varied clauses and punctuation with sufficient control for a clear sustained argument.']][level];const strongKK=[['Ойдан шығарылған оқырманға қажетті қарапайым бөлшектерді толық береді.','Қысқа сөйлемдерді түсінікті ретпен береді'+(g===4?', қарапайым байланыстарды қолданады.':'.'),'Таныс сөздер мен нақты бөлшектерді орынды қолданады.','Қысқа сөйлемдері түсінікті; бас әріп пен соңғы тыныс белгілерін қолданады.'],['Мақсатты қажетті бөлшек пен мысал арқылы орындайды.','Абзацты не хатты кіріспе, байланыс және аяқталуымен реттейді.','Тақырыптық сөздерді мағынаға сай қолданып, орынсыз қайталауды азайтады.','Жиі қолданылатын сөйлемдер мен тыныс белгілерін меңгерген; қате мағынаны сирек бұзады.'],['Мақсат пен аудиторияға сай бөлшек, себеп не пайдалы кеңесті дамытады.','Абзацтар мен жанр белгілерін мағыналы байланыстырып, анық аяқтайды.','Оқырманға сай сөздер мен стильді таңдап, әртүрлі тіркес қолданады.','Әртүрлі сөйлем үлгілерін қолданады; грамматика мен тыныс белгілері түсінуге көмектеседі.'],['Мақсатты дәлелмен не анық ойдан шығарылған мысалмен дамытып, шектеулерді мойындайды'+(g===11?' және қорытынды күшін мұқият шектейді.':'.'),'Жанр құрылымын сақтап, тұжырым, дәлел, балама және қорытындыны байланыстырады.','Дәл академиялық не ресми сөздерді оқырманға сай, түсінікті стильде қолданады.','Күрделі сөйлемдер мен тыныс белгілерін жүйелі ойды түсіндіруге жеткілікті меңгерген.']][level];const mid=kk?['Мақсаттың басым бөлігі орындалған, бір маңызды бөлшек жетіспейді.','Реті негізінен түсінікті, кей өтулер не жанр белгілері әлсіз.','Сөздер негізінен орынды, бірақ қайталау не дәл емес таңдау бар.','Қателер бар, дегенмен негізгі мағына анық.']:['Purpose mostly met, with one important detail missing.','Mostly logical, with weak transitions or a missing genre feature.','Mostly appropriate, with repetition or occasional imprecision.','Some errors, but the main meaning remains clear.'];const low=kk?['Міндеттің аз бөлігі ғана орындалған, мазмұн жеткіліксіз.','Ойлар үзік не тізім түрінде, байланысын түсіну қиын.','Сөздер өте шектеулі, мағынаны жиі түсініксіз етеді.','Жиі қателер мағынаны түсінуге кедергі келтіреді.']:['Only a small part of the task addressed; insufficient relevant detail.','Ideas are disconnected or listed with little clear progression.','Very limited choices frequently obscure meaning.','Frequent errors often interfere with meaning.'];return names.map((name,i)=>({name,levels:[kk?'Осы өлшем бойынша бағалауға жеткілікті дәлел жоқ.':'No assessable evidence for this criterion.',low[i],mid[i],(kk?strongKK:strongEN)[i]]}))}
function rubricTable(u){const rows=rubricData(u.grade);return `<div class="rubric-scroll"><table class="rubric"><thead><tr><th>${state.lang==='kk'?'Өлшем':'Criterion'}</th><th>3</th><th>2</th><th>1</th><th>0</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td>${[3,2,1,0].map(n=>`<td>${esc(r.levels[n])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function teacherPanel(u){if(!state.answers)return '';const d=entry(u),kk=state.lang==='kk';return `<section class="card">${heading('T',t().teacher)}<p class="fine">${kk?'Үлгі құрылым мен тілге мысал болады, көшіретін сценарий емес. Жаңа міндетке сай басқа есімдер, бөлшектер, ұстанымдар және шешімдер қабылданады. Оқушының моральдық сенімін емес, коммуникация мен тілді бағалаңыз. Сезімтал тақырыптарда тек ойдан шығарылған жағдай қолданыңыз.':esc(u.teacher)}</p><h4>${t().rubric}</h4>${rubricTable(u)}<p class="no-auto">${t().manualNote}</p><div class="manual-grid">${rubricData(u.grade).map((r,i)=>`<label>${esc(r.name)}<select data-field="rubric" data-index="${i}" aria-label="${esc(r.name)}"><option value=""></option>${[0,1,2,3].map(n=>`<option value="${n}" ${String(d.rubric?.[i]??'')===String(n)?'selected':''}>${n}</option>`).join('')}</select></label>`).join('')}</div><p id="manualResult" class="fine"></p><label for="teacherComment" class="minihead">${t().commentLabel}</label><textarea id="teacherComment" data-field="teacherComment" class="teacher-feedback">${esc(d.teacherComment||'')}</textarea></section>`}
function render(){const list=filtered();$('printOne').disabled=!list.length;$('answersButton').disabled=!list.length;if(!list.length){$('article').innerHTML=`<section class="card"><p>${t().empty}</p></section>`;$('previous').disabled=true;$('next').disabled=true;$('unitProgress').textContent='';return}const u=unit(),d=entry(u),kk=state.lang==='kk',noticeLabels=kk?(u.grade<=4?t().noticeQs:t().noticeOlder):u.notice.map(n=>n.q);$('breadcrumb').textContent=t().grade(u.grade)+' / '+u.category;const genre=kk?GENRE_KK[u.genre]:u.genre;
$('article').innerHTML=`<section class="card"><div class="reading-meta"><span class="pill">${t().grade(u.grade)}</span><span>${esc(u.category)}</span><span class="support-chip">${t().support[u.support]}</span></div><h2 class="writing-title" id="writingTitle" tabindex="-1" lang="en">${esc(u.title)}</h2><div class="unit-steps">${t().steps.map((s,i)=>`<span>${i+1}. ${s}</span>`).join('')}</div><div class="goal"><strong class="minihead">${t().goal}</strong>${kk?`Жаңа жағдаятқа сай ${esc(genre)} жазыңыз. Нақты бөлшектерді қолданып, оқырманға түсінікті аяқтаңыз.`:esc(u.goal)}</div><div class="brief"><div><strong>${t().audience}</strong>${kk?'Оқырман: '+esc(u.audienceKK)+'. Жағдаят пен адамдар ойдан шығарылған.':esc(u.audience)+'. All people and situations may be invented.'}</div><div><strong>${t().guide}</strong>${esc(genre)} · ${guide(u)}<div class="fine">${t().notRule}</div></div></div></section>
<section class="card"><div class="model-toggle"><h3 class="section-heading"><span class="section-num">1</span>${t().model}</h3><button class="btn small-action" id="modelButton" aria-expanded="${state.model}" aria-controls="modelBody">${state.model?t().hideModel:t().showModel}</button></div><div id="modelBody" ${state.model?'':'hidden'}><p class="fine">${u.words} ${t().words} · ${esc(u.genre)} · ${kk?'Авторлық оқу үлгісі':'Original educational model'}</p><div class="model-text ${u.grade<=4?'primary-text':''}" lang="en">${paragraphs(u.model,u.grade)}</div></div></section>
<section class="card">${heading('2',t().notice)}${u.notice.map((n,i)=>`<div class="notice-question"><label for="notice${i}">${i+1}. ${esc(noticeLabels[i])}</label><textarea id="notice${i}" data-field="notice" data-index="${i}">${esc(d.notice?.[i]||'')}</textarea><span class="open-note">${t().openLabel}</span>${state.answers?`<div class="teacher-answer"><strong>${t().sample}:</strong> <span lang="en">${esc(n.answer)}</span></div>`:''}</div>`).join('')}<h4>${t().bank}</h4><div class="wordbank" lang="en">${u.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div><strong class="minihead">${t().links}</strong><div class="wordbank linkbank" lang="en">${u.linkers.map(w=>`<span>${esc(w)}</span>`).join('')}</div></section>
<section class="card">${heading('3',t().practice)}<form id="practiceForm">${u.practice.map((p,i)=>practiceInput(p,i,u)).join('')}<button type="button" class="btn primary" id="check">${t().check}</button><div id="practiceResult" role="status" aria-live="polite"></div></form></section>
<section class="card">${heading('4',t().plan)}<ol>${planInstructions(u).map(p=>`<li>${esc(p)}</li>`).join('')}</ol>${u.starters.length?`<details><summary>${t().starters}</summary><p lang="en">${u.starters.map(esc).join(' · ')}</p><p class="fine">${kk?'Өз бөлшектеріңізбен толықтырыңыз.':'Complete these with your own details.'}</p></details>`:''}<label class="minihead" for="planning">${t().planLabel}</label><textarea id="planning" data-field="plan" class="plan-field" placeholder="${t().planPlaceholder}">${esc(d.plan||'')}</textarea></section>
<section class="card">${heading('5',t().write)}<div class="prompt-box" ${kk?'':'lang="en"'}>${esc(kk?u.independentKK:u.independent)}</div>${kk?`<details class="independent-english"><summary>${t().promptLang}</summary><p lang="en">${esc(u.independent)}</p><p lang="en">Audience: ${esc(u.audience)}.</p></details>`:`<p class="fine">Audience: ${esc(u.audience)}.</p>`}<p class="fine">${guide(u)} · ${t().notRule}</p><label class="minihead" for="draft">${t().draftLabel}</label><textarea class="draft-area" id="draft" data-field="draft" spellcheck="true" lang="en" placeholder="${t().draftPlaceholder}">${esc(d.draft||'')}</textarea><div class="editor-footer"><span class="wordcount" id="wordCount" role="status">${t().wordCount(wordCount(d.draft||''))}</span><span class="saving" id="saveNote">${storageOK?t().saved:t().noSave}</span></div><p class="no-auto">${t().notWritingGrade}</p><div class="bottom-actions"><button class="btn primary" id="export">${t().export}</button><button class="btn" id="reset">${t().reset}</button></div><p id="actionMessage" class="fine" role="status" aria-live="polite"></p></section>
<section class="card">${heading('6',t().revise)}<div class="checklist">${CHECK[state.lang].map((c,i)=>`<label class="checkitem"><input type="checkbox" data-field="checklist" data-index="${i}" ${d.checklist?.[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div><details><summary>${t().rubric}</summary>${rubricTable(u)}<p class="fine">${t().notWritingGrade}</p></details></section>${teacherPanel(u)}`;
$('modelButton').onclick=()=>{state.model=!state.model;$('modelBody').hidden=!state.model;$('modelButton').textContent=state.model?t().hideModel:t().showModel;$('modelButton').setAttribute('aria-expanded',state.model)};$('practiceForm').addEventListener('submit',e=>e.preventDefault());$('check').onclick=check;$('reset').onclick=()=>{delete db[u.id];persist();render();topics();$('actionMessage').textContent=t().resetDone};$('export').onclick=exportText;const pos=list.findIndex(x=>x.id===u.id);$('unitProgress').textContent=(pos+1)+' / '+list.length;$('previous').disabled=pos<=0;$('next').disabled=pos<0||pos>=list.length-1;$('answersButton').textContent=state.answers?t().hideAnswers:t().answers;$('answersButton').setAttribute('aria-pressed',state.answers);if(d.checked)feedback();manualResult();resizeDraft()}
function normalise(s){return String(s??'').trim().replace(/\s+/g,' ').replace(/’/g,"'")}
function isCorrect(p,v){if(p.type==='edit')return normalise(v)===normalise(p.answer);if(p.type==='reorder')return normalise(v).toLowerCase().replace(/[.!?]$/,'')===normalise(p.answer).toLowerCase().replace(/[.!?]$/,'');return normalise(v).toLowerCase()===normalise(p.answer).toLowerCase()}
function feedback(){const u=unit(),d=entry(u);let score=0,total=0;u.practice.forEach((p,i)=>{const el=$('feedback'+i),v=d.practice?.[i]||'';if(p.type==='open'){el.textContent=t().openLabel;el.className='feedback';return}total++;const good=isCorrect(p,v);if(good)score++;el.className='feedback '+(good?'good':'bad');el.textContent=(!v?t().missing:good?t().correct:t().incorrect)+' '+explain(p)});$('practiceResult').innerHTML=`<div class="result"><strong>${t().practiceScore}: ${score} / ${total}</strong><br><span class="fine">${t().notWritingGrade}</span></div>`}
function check(){ensure().checked=true;persist();feedback()}
function manualResult(){if(!$('manualResult'))return;const r=entry(unit()).rubric||{};const v=[0,1,2,3].map(i=>r[i]);$('manualResult').textContent=v.every(x=>x!==undefined&&x!==''&&['0','1','2','3'].includes(String(x)))?t().manualResult+': '+v.reduce((a,x)=>a+Number(x),0)+' / 12':t().notRated}
function resizeDraft(){const d=$('draft');if(!d)return;d.style.height='auto';d.style.height=Math.max(280,d.scrollHeight||0)+'px'}
function record(target){const f=target.dataset.field;if(!f)return;const d=ensure(),i=target.dataset.index;if(['notice','practice','rubric','checklist'].includes(f)){if(!d[f])d[f]={};d[f][i]=f==='checklist'?target.checked:target.value}else if(f==='order'){if(!d.practice)d.practice={};let parts=String(d.practice[i]||'--').split('-');while(parts.length<3)parts.push('');parts[Number(target.dataset.position)]=target.value;d.practice[i]=parts.join('-')}else d[f]=target.value;
if(f==='practice'||f==='order'){d.checked=false;if($('practiceResult'))$('practiceResult').textContent='';unit().practice.forEach((_,i)=>{if($('feedback'+i))$('feedback'+i).textContent=''})}persist();if(f==='draft'){$('wordCount').textContent=t().wordCount(wordCount(d.draft));resizeDraft();const before=!!target.dataset.hadDraft,now=!!d.draft.trim();if(before!==now){topics();target.dataset.hadDraft=now?'1':''}}if(f==='rubric')manualResult();if($('saveNote'))$('saveNote').textContent=storageOK?t().saved:t().noSave}
function buildExport(u,d){return ['English Writing Skill Development Tasks','Grade '+u.grade+' | '+u.category,u.title,'Genre: '+u.genre,'Suggested range: '+range(u.grade).join('–')+' words','', 'INDEPENDENT TASK',u.independent,'','PLANNING NOTES',d.plan||'','', 'STRUCTURE RESPONSES',...u.notice.map((n,i)=>(i+1)+'. '+n.q+'\n'+(d.notice?.[i]||'')),'','PRACTICE RESPONSES',...u.practice.map((p,i)=>(i+1)+'. '+p.prompt+'\n'+(d.practice?.[i]||'')),'','INDEPENDENT WRITING',d.draft||'','', 'Word count (informational only): '+wordCount(d.draft||''),'','MANUAL FEEDBACK',d.teacherComment||'','Manual rubric: '+[0,1,2,3].map(i=>d.rubric?.[i]??'not entered').join(' / '),'','No automatic grade has been assigned to the independent writing.'].join('\n')}
function exportText(){const u=unit(),text=buildExport(u,entry(u)),blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='writing-grade-'+u.grade+'-topic-'+(u.topic+1)+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('actionMessage').textContent=state.lang==='kk'?'Жазбаны жүктеу басталды.':'Writing download started.'}
function printUnit(u,keys){const kk=state.lang==='kk';return `<article class="print-unit"><div class="print-meta">English Skills 4.0 · ${t().grade(u.grade)} · ${esc(u.category)} · ${esc(u.genre)} · ${guide(u)}</div><h1 lang="en">${esc(u.title)}</h1><h2>${t().goal}</h2><p>${esc(u.goal)}</p><p>Audience: ${esc(u.audience)}.</p><h2>1. ${t().model}</h2><div class="print-text" lang="en">${paragraphs(u.model,u.grade)}</div><h2>2. ${t().notice}</h2>${u.notice.map((n,i)=>`<div class="print-task"><p>${i+1}. ${esc(kk?(u.grade<=4?t().noticeQs:t().noticeOlder)[i]:n.q)}</p><div class="answer-lines"></div></div>`).join('')}<p>${t().bank}: ${u.bank.map(esc).join(' · ')}</p><p>${t().links}: ${u.linkers.map(esc).join(' · ')}</p><h2>3. ${t().practice}</h2>${u.practice.map((p,i)=>`<div class="print-task"><strong>${i+1}. ${esc(prompt(p,u))}</strong><p class="print-source">${Array.isArray(p.source)?p.source.map((s,j)=>(j+1)+'. '+esc(s)).join('<br>'):esc(p.source)}</p>${p.type==='choice'?'<p>'+p.options.map(x=>'☐ '+esc(x)).join(' &nbsp; ')+'</p>':p.type==='order'?'<p>____ → ____ → ____</p>':'<div class="answer-lines"></div>'}</div>`).join('')}<h2>4. ${t().plan}</h2><ol>${planInstructions(u).map(esc).map(x=>'<li>'+x+'</li>').join('')}</ol><div class="print-lines"></div><h2>5. ${t().write}</h2><p>${esc(kk?u.independentKK:u.independent)}</p><p>${guide(u)}. ${t().notRule}</p><div class="print-lines"></div><div class="print-lines"></div><div class="print-lines"></div><h2>6. ${t().revise}</h2><ul>${CHECK[state.lang].map(c=>'<li>☐ '+esc(c)+'</li>').join('')}</ul><p>${t().notWritingGrade}</p>${keys?`<section class="print-key"><h2>${t().teacher} · ${t().sample}</h2><h3>${t().notice}</h3>${u.notice.map((n,i)=>`<p>${i+1}. ${esc(n.answer)}</p>`).join('')}<h3>${t().practice}</h3>${u.practice.map((p,i)=>`<p><strong>${i+1}.</strong> ${esc(p.answer)}<br>${esc(explain(p))}</p>`).join('')}<h3>${t().rubric}</h3>${rubricTable(u)}<p>${esc(u.teacher)}</p></section>`:''}<footer>Original fictional educational models · ${t().grade(u.grade)} · ${u.topic+1}/16</footer></article>`}
function printUnits(all){const keys=$('printMode').value==='key';$('printArea').innerHTML=(all?group():[unit()]).map(u=>printUnit(u,keys)).join('');window.print()}
function filter(){const list=filtered();if(list.length&&!list.some(u=>u.topic===state.topic))state.topic=list[0].topic;hash();topics();render()}
function selectTopic(n,focus=false){state.topic=n;hash();topics();render();if(focus)$('writingTitle').focus({preventScroll:true})}
function help(){const kk=state.lang==='kk';$('teacherSummary').textContent=t().about;$('teacherContent').innerHTML=kk?`<h3>Жинақ және бағалау</h3><p>3–11 сыныптардың әрқайсысында 16 толық жинақ бар: барлығы 144 жазылым тапсырмасы, 144 авторлық үлгі, 288 құрылым сұрағы және 480 дайындық жаттығуы. 3–4 сыныптарда үш жабық жаттығу, 5–8 сыныптарда екі жабық және бір ашық, 9–11 сыныптарда екі жабық және екі ашық жаттығу беріледі. Бағдарламалық ұпай тек жабық жаттығуларға қатысты. Еркін жазылымды мұғалім төрт өлшеммен, әрқайсысын 0–3 балмен бағалай алады. Ұпай енгізілмесе, жазылым бағасы шығарылмайды. Сөз саны тек ақпарат береді.</p><h3>Қолдау және баламалар</h3><p>Алғашқы алты тақырыпта жоспар мен тіркестер көбірек, келесі жетеуінде қысқартылған, соңғы үшеуінде дербес жоспар ұсынылады. Сынып CEFR деңгейіне автоматты теңестірілмейді. Мұғалім сөз көлемін, уақыт пен тіректерді оқушыға бейімдейді. Үлгіден басқа дұрыс жанрлық құрылымдар, мағынасы сай сөздер мен негізделген ұстанымдар қабылданады. Жабық жаттығу үлгінің нақты нұсқасын сұраса ғана кілтпен салыстырады.</p><h3>Құпиялылық және сақтау</h3><p>Жағдаяттар ойдан шығарылған; оқушының аты-жөні, байланысы немесе ауыр жеке тәжірибесі сұралмайды. Жауаптар осы браузердің жергілікті сақтауында қалады және сыртқа жіберілмейді. Басқа құрылғыға автоматты көшпейді. Ортақ компьютерде жұмысты аяқтаған соң мәтінді жүктеп, осы жинақтағы жауаптарды тазартуға болады. Сақтау бұғатталса, бет жұмысын жалғастырады; жүктеу батырмасын қолданыңыз. ЖИ сервисі қосылмаған және еркін мәтінді бағаламайды.</p><h3>Басып шығару және дереккөз</h3><p>Жоғарғы таңдаудан кілтсіз жұмыс парағын немесе жауап кілтімен нұсқаны таңдаңыз. Ағымдағы жинақты не сыныптың барлық 16 жинағын басуға болады. Оқушының сақталған жазбасы жұмыс парағына автоматты қосылмайды; оны .txt арқылы бөлек жүктеңіз. Үлгілер мен тапсырмалар осы жоба үшін ЖИ көмегімен жаңадан әзірленген, сыртқы мәтіндер көшірілмеген. Кез келген нақты дерек қолданылған жаңа жазылымда автор оның көзін көрсетуі тиіс.</p><h3>GitHub Pages-та жариялау</h3><ol><li>GitHub-та жаңа Public репозиторий ашыңыз, мысалы english-writing-skills.</li><li>Осы index.html файлын репозиторийдің негізгі қалтасына жүктеп, Commit changes арқылы сақтаңыз.</li><li>Settings → Pages → Source → Deploy from a branch таңдаңыз.</li><li>Branch: main, folder: /(root) таңдап, Save басыңыз.</li><li>Жариялау аяқталған соң Pages бөліміндегі сілтемені ашыңыз.</li></ol>`:`<h3>Collection and assessment</h3><p>Nine grades contain 16 units each: 144 writing tasks, 144 original models, 288 structure questions and 480 practice activities. Grades 3–4 have three closed exercises; Grades 5–8 have two closed exercises and one open exercise; Grades 9–11 have two closed and two open exercises. Automatic points apply only to closed practice. Independent writing requires human review using four criteria, each 0–3. No writing total appears until a person enters all four scores. Word count is informational.</p><h3>Support and alternatives</h3><p>The first six topics provide more planning and opening support; the next seven reduce it; the last three offer independent planning. Grade labels are not automatic CEFR assignments. Adapt time, support and length to the learner. Accept coherent alternatives in independent work. Exact reconstruction is required only when a closed exercise explicitly asks for the model wording or sequence.</p><h3>Privacy and saving</h3><p>Situations are fictional. No names, contact details or distressing personal disclosures are required. Responses stay in this browser and are not sent to a server or another device. On shared computers, download your work and clear the current unit afterwards. If browser storage is blocked, the page continues working and the download remains available. No live AI service assesses writing.</p><h3>Printing and sources</h3><p>Select worksheet-only or answer-key mode before printing one unit or the whole grade. Saved learner drafts are not inserted in worksheets; export them separately. These original educational models and tasks were newly written for this project with AI assistance; no external passages were copied. Writers using real factual claims in new drafts should cite their actual sources.</p><h3>Publish with GitHub Pages</h3><ol><li>Create a Public repository, for example english-writing-skills.</li><li>Upload index.html to its root and commit the change.</li><li>Open Settings → Pages → Source → Deploy from a branch.</li><li>Select main and /(root), then Save.</li><li>After deployment, open the link shown in Pages.</li></ol>`}
function localise(){document.documentElement.lang=state.lang;$('langButton').textContent=state.lang==='kk'?'EN interface':'Қазақша';$('langButton').setAttribute('aria-label',state.lang==='kk'?'Switch interface to English':'Интерфейсті қазақша көрсету');$('heroDesc').textContent=t().hero;['numGrade','numUnit','numPractice'].forEach((id,i)=>$(id).textContent=t().num[i]);$('search').placeholder=t().search;$('searchLabel').textContent=t().search;[...$('strand').options].forEach((o,i)=>o.textContent=t().filters[i]);[...$('printMode').options].forEach((o,i)=>o.textContent=t().printOpts[i]);$('printOne').textContent=t().printOne;$('printGrade').textContent=t().printGrade;$('previous').textContent=t().prev;$('next').textContent=t().next;$('footerNote').textContent=t().foot;grades();topics();render();help()}
$('grades').addEventListener('click',e=>{const b=e.target.closest('[data-grade]');if(!b)return;state.grade=+b.dataset.grade;state.topic=0;$('search').value='';$('strand').value='all';hash();grades();topics();render()});$('topics').addEventListener('click',e=>{const b=e.target.closest('[data-topic]');if(b)selectTopic(+b.dataset.topic,true)});$('article').addEventListener('input',e=>record(e.target));$('article').addEventListener('change',e=>{if(e.target.tagName==='SELECT'||e.target.type==='checkbox')record(e.target)});$('search').addEventListener('input',filter);$('strand').addEventListener('change',filter);$('langButton').onclick=()=>{state.lang=state.lang==='kk'?'en':'kk';localise()};$('answersButton').onclick=()=>{state.answers=!state.answers;render()};$('previous').onclick=()=>{const a=filtered(),i=a.findIndex(x=>x.id===unit().id);if(i>0)selectTopic(a[i-1].topic,true)};$('next').onclick=()=>{const a=filtered(),i=a.findIndex(x=>x.id===unit().id);if(i>=0&&i<a.length-1)selectTopic(a[i+1].topic,true)};$('printOne').onclick=()=>printUnits(false);$('printGrade').onclick=()=>printUnits(true);window.addEventListener('hashchange',()=>{readHash();$('search').value='';$('strand').value='all';localise()});readHash();localise();
</script></body></html>
